<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>客户对账工作台</title>
<style>
body{font-family:Arial,"Microsoft YaHei",sans-serif;margin:0;background:#f5f6f8;color:#222}
header{background:#1f4e78;color:#fff;padding:16px 22px}
main{padding:16px}
.card{background:#fff;border:1px solid #ddd;border-radius:8px;padding:14px;margin-bottom:14px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:end}
label{display:flex;flex-direction:column;gap:4px;font-size:13px}
input,select,button,textarea{padding:8px;border:1px solid #bbb;border-radius:4px}
button{cursor:pointer}.primary{background:#1f4e78;color:#fff}.success{background:#1f7a3f;color:#fff}.warn{background:#9a6700;color:#fff}
.layout{display:grid;grid-template-columns:360px 1fr;gap:14px}
.summary{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.metric{background:#eef3f8;border-radius:6px;padding:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.list{max-height:440px;overflow:auto;border:1px solid #ddd}
.item{padding:10px;border-bottom:1px solid #eee;cursor:pointer}
.item:hover,.item.active{background:#eaf2fb}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{border:1px solid #ddd;padding:7px;text-align:left;vertical-align:top}
th{background:#eef3f8}
.small{font-size:12px;color:#666}.error{color:#b00020}.ok{color:#136f3a}.status{font-size:18px;font-weight:bold}
@media(max-width:1000px){.layout,.grid{grid-template-columns:1fr}.summary{grid-template-columns:1fr 1fr}}

/* TLC_CUSTOMER_RECONCILIATION_LIST_INTERACTION_R1 */
.recon-list-tools{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin:8px 0}
.recon-list-tools input,.recon-list-tools select{min-width:150px}
.recon-list-tools .page-info{margin-left:auto;color:#667085;font-size:12px}
table[data-recon-list] tbody tr{cursor:pointer}
table[data-recon-list] tbody tr:hover{background:#fff4cc}
table[data-recon-list] tbody tr.recon-active{background:#ffe08a!important}
table[data-recon-list] th[data-recon-sort]{cursor:pointer;user-select:none;white-space:nowrap}
table[data-recon-list] th[data-recon-sort]::after{content:' ↕';color:#8290a3;font-size:11px}
table[data-recon-list] th[data-recon-sort][aria-sort='ascending']::after{content:' ↑';color:#1f4e78}
table[data-recon-list] th[data-recon-sort][aria-sort='descending']::after{content:' ↓';color:#1f4e78}
</style>
</head>
<body>
<header>
<h1>客户对账工作台</h1>
<div>客户选择 → 客户匹配 → 区间统计 → 对账确认 → 历史查看</div>
</header>
<main>
<div class="layout">
<section class="card">
  <h2>客户</h2>
  <div class="toolbar">
    <input id="customerQuery" placeholder="ID / 名称 / 别名">
    <button onclick="loadCustomers()">检索</button>
    <button onclick="openCustomerMaster()">客户档案</button>
  </div>
  <div id="customerList" class="list"></div>
</section>

<section>
  <section class="card">
    <h2 id="customerTitle">请选择客户</h2>
    <div class="toolbar">
      <label>Customer ID<input id="customerId" readonly ondblclick="openCustomerMaster()"></label>
      <label>上次请求截止日<input id="previousRequest" type="date"></label>
      <label>本次请求截止日<input id="currentRequest" type="date"></label>
      <label>上次银行截止日<input id="previousBank" type="date"></label>
      <label>本次银行截止日<input id="currentBank" type="date"></label>
      <label>期初未付<input id="openingOutstanding" placeholder="自动承接上次期末"></label>
    </div>
    <div class="toolbar">
      <button class="warn" onclick="runBankMatching()">执行银行客户匹配</button>
      <button class="primary" onclick="calculate()">计算对账</button>
      <button onclick="openBankImport()">银行流水</button>
      <button onclick="openSalesLedger()">销售台账</button>
    </div>
    <div id="matchingMessage" class="small"></div>
  </section>

  <section class="card">
    <div class="summary">
      <div class="metric">期初未付<br><strong id="opening">0</strong></div>
      <div class="metric">本期销售<br><strong id="sales">0</strong></div>
      <div class="metric">本期入金<br><strong id="payments">0</strong></div>
      <div class="metric">期末未付<br><strong id="closing">0</strong></div>
      <div class="metric">状态<br><strong id="status" class="status">-</strong></div>
    </div>
  </section>

  <section class="card">
    <div class="toolbar">
      <label>确认人<input id="confirmedBy"></label>
      <label style="min-width:360px">备注<textarea id="note"></textarea></label>
      <button class="success" onclick="confirmResult()">确认并保存</button>
    </div>
    <div id="saveMessage" class="small"></div>
  </section>
</section>
</div>

<div class="grid">
<section class="card">
<h2>销售明细</h2>
<div style="overflow:auto">
<table><thead><tr><th>请求书</th><th>日期</th><th>客户</th><th>币种</th><th>金额</th></tr></thead>
<tbody id="salesBody"></tbody></table>
</div>
</section>
<section class="card">
<h2>入金明细</h2>
<div style="overflow:auto">
<table><thead><tr><th>银行</th><th>日期</th><th>流水ID</th><th>对方</th><th>金额</th></tr></thead>
<tbody id="paymentBody"></tbody></table>
</div>
</section>
</div>

<div class="grid">
<section class="card">
<h2>未匹配 / 歧义银行流水</h2>
<div style="overflow:auto">
<table><thead><tr><th>状态</th><th>对方</th><th>标准化名称</th><th>候选客户</th></tr></thead>
<tbody id="exceptionBody"></tbody></table>
</div>
</section>
<section class="card">
<h2>对账历史</h2>
<div style="overflow:auto">
<table><thead><tr><th>确认时间</th><th>请求区间</th><th>银行区间</th><th>期初</th><th>销售</th><th>入金</th><th>期末</th><th>状态</th></tr></thead>
<tbody id="historyBody"></tbody></table>
</div>
</section>
</div>
</main>

<script>
let selectedCustomer=null;
let calculated=null;

function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
async function api(url,options){
  const r=await fetch(url,options);
  let b;
  try{b=await r.json()}catch(e){b=await r.text()}
  if(!r.ok)throw new Error(b.detail||String(b));
  return b;
}
function today(){return new Date().toISOString().slice(0,10)}
function openCustomerMaster(){window.open("/tlc-customer-master","_blank")}
function openBankImport(){window.open("/bank-import","_blank")}
function openSalesLedger(){window.open("/requests/review-workbench","_blank")}

async function loadCustomers(){
  const p=new URLSearchParams();
  const q=document.getElementById("customerQuery").value.trim();
  if(q)p.set("query",q);
  p.set("include_inactive","false");
  p.set("limit","0");
  const rows=await api("/api/tlc-customers?"+p.toString());
  const list=document.getElementById("customerList");list.innerHTML="";
  rows.forEach(r=>{
    const div=document.createElement("div");
    div.className="item"+(selectedCustomer&&selectedCustomer.id===r.id?" active":"");
    div.innerHTML=`<strong>${esc(r.customer_id)}</strong><br>${esc(r.formal_name)}<br><span class="small">${esc(r.short_name||r.katakana_name||"")}</span>`;
    div.onclick=()=>selectCustomer(r);
    div.ondblclick=()=>{selectCustomer(r);openCustomerMaster()};
    list.appendChild(div);
  });
}

async function selectCustomer(r){
  selectedCustomer=r;
  document.getElementById("customerId").value=r.customer_id;
  document.getElementById("customerTitle").textContent=`${r.customer_id} / ${r.formal_name}`;
  await loadLatest();
  await loadHistory();
  await loadCustomers();
}

async function loadLatest(){
  if(!selectedCustomer)return;
  const latest=await api("/api/customer-payment-reconciliation/latest?customer_id="+encodeURIComponent(selectedCustomer.customer_id));
  if(latest&&latest.id){
    document.getElementById("previousRequest").value=latest.current_request_cutoff||"";
    document.getElementById("previousBank").value=latest.current_bank_cutoff||"";
    document.getElementById("openingOutstanding").value=latest.closing_outstanding||"";
  }else{
    document.getElementById("previousRequest").value="";
    document.getElementById("previousBank").value="";
    document.getElementById("openingOutstanding").value="";
  }
  document.getElementById("currentRequest").value=today();
  document.getElementById("currentBank").value=today();
}

async function runBankMatching(){
  try{
    const result=await api("/api/customer-bank-matching/run?limit=1000",{method:"POST"});
    document.getElementById("matchingMessage").textContent=
      `processed=${result.processed}, matched=${result.matched}, unmatched=${result.unmatched}, ambiguous=${result.ambiguous}`;
    renderExceptions(result.results||[]);
  }catch(e){alert(e.message)}
}

function renderExceptions(rows){
  const body=document.getElementById("exceptionBody");body.innerHTML="";
  rows.filter(r=>r.status!=="MATCHED").forEach(r=>{
    const candidates=(r.candidates||[]).map(x=>x.customer_id).join(", ");
    const tr=document.createElement("tr");
    tr.innerHTML=`<td class="error">${esc(r.status)}</td><td>${esc(r.counterparty)}</td><td>${esc(r.normalized_counterparty)}</td><td>${esc(candidates)}</td>`;
    body.appendChild(tr);
  });
}

function requestPayload(){
  return {
    customer_id:document.getElementById("customerId").value.trim(),
    previous_request_cutoff:document.getElementById("previousRequest").value,
    current_request_cutoff:document.getElementById("currentRequest").value,
    previous_bank_cutoff:document.getElementById("previousBank").value,
    current_bank_cutoff:document.getElementById("currentBank").value,
    opening_outstanding:document.getElementById("openingOutstanding").value.trim()
  };
}

async function calculate(){
  const p=new URLSearchParams(requestPayload());
  try{
    calculated=await api("/api/customer-payment-reconciliation/calculate?"+p.toString());
    document.getElementById("opening").textContent=calculated.opening_outstanding;
    document.getElementById("sales").textContent=calculated.sales_total;
    document.getElementById("payments").textContent=calculated.payment_total;
    document.getElementById("closing").textContent=calculated.closing_outstanding;
    document.getElementById("status").textContent=calculated.status;
    renderSales(calculated.sales||[]);
    renderPayments(calculated.payments||[]);
  }catch(e){alert(e.message)}
}

function renderSales(rows){
  const body=document.getElementById("salesBody");body.innerHTML="";
  rows.forEach(r=>{
    const tr=document.createElement("tr");
    tr.innerHTML=`<td>${esc(r.request_no)}</td><td>${esc(r.request_date)}</td><td>${esc(r.customer_name)}</td><td>${esc(r.currency)}</td><td>${esc(r.total_amount)}</td>`;
    body.appendChild(tr);
  });
}

function renderPayments(rows){
  const body=document.getElementById("paymentBody");body.innerHTML="";
  rows.forEach(r=>{
    const tr=document.createElement("tr");
    tr.innerHTML=`<td>${esc(r.bank_name)}</td><td>${esc(r.transaction_date)}</td><td>${esc(r.transaction_id)}</td><td>${esc(r.counterparty)}</td><td>${esc(r.amount)}</td>`;
    body.appendChild(tr);
  });
}

async function confirmResult(){
  const body={
    ...requestPayload(),
    confirmed_by:document.getElementById("confirmedBy").value.trim(),
    note:document.getElementById("note").value
  };
  try{
    const result=await api("/api/customer-payment-reconciliation/confirm",{
      method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)
    });
    document.getElementById("saveMessage").textContent=result.status==="saved"?"保存成功":"该期间已保存";
    await loadHistory();
    await loadLatest();
    await calculate();
  }catch(e){alert(e.message)}
}

async function loadHistory(){
  if(!selectedCustomer)return;
  const rows=await api("/api/customer-payment-reconciliation/history?customer_id="+encodeURIComponent(selectedCustomer.customer_id));
  const body=document.getElementById("historyBody");body.innerHTML="";
  rows.forEach(r=>{
    const tr=document.createElement("tr");
    tr.innerHTML=`<td>${esc(r.confirmed_at)}</td>
      <td>${esc(r.previous_request_cutoff)} → ${esc(r.current_request_cutoff)}</td>
      <td>${esc(r.previous_bank_cutoff)} → ${esc(r.current_bank_cutoff)}</td>
      <td>${esc(r.opening_outstanding)}</td><td>${esc(r.period_sales_total)}</td>
      <td>${esc(r.period_payment_total)}</td><td>${esc(r.closing_outstanding)}</td><td>${esc(r.status)}</td>`;
    body.appendChild(tr);
  });
}

document.getElementById("currentRequest").value=today();
document.getElementById("currentBank").value=today();
loadCustomers().catch(e=>alert(e.message));
</script>
<script>
/* TLC_TABLE_ROW_SELECTOR_V1 */
(function(){
  const NUMBER_CLASS="tlc-row-no";
  const CHECK_CLASS="tlc-row-check";
  let scheduled=false;

  function headerRows(table){
    const explicit=[...table.querySelectorAll("thead tr")];
    if(explicit.length) return explicit;
    const first=[...table.querySelectorAll("tr")].find(row=>row.querySelector("th"));
    return first?[first]:[];
  }

  function dataRows(table,headers){
    const headerSet=new Set(headers);
    return [...table.querySelectorAll("tr")].filter(row=>{
      if(headerSet.has(row)) return false;
      if(row.querySelector("th") && !row.querySelector("td")) return false;
      return true;
    });
  }

  function addHeader(row){
    if(row.querySelector("."+NUMBER_CLASS)) return;

    const checkTh=document.createElement("th");
    checkTh.className=CHECK_CLASS;
    checkTh.style.width="38px";
    checkTh.style.textAlign="center";

    const all=document.createElement("input");
    all.type="checkbox";
    all.title="全选/取消全选";
    all.addEventListener("click",event=>event.stopPropagation());
    all.addEventListener("change",()=>{
      const table=row.closest("table");
      table.querySelectorAll("input.tlc-row-select").forEach(input=>{
        input.checked=all.checked;
      });
    });
    checkTh.appendChild(all);

    const noTh=document.createElement("th");
    noTh.className=NUMBER_CLASS;
    noTh.textContent="No";
    noTh.style.width="52px";
    noTh.style.textAlign="center";

    row.insertBefore(checkTh,row.firstChild);
    row.insertBefore(noTh,row.firstChild);
  }

  function addData(row,index){
    let no=row.querySelector(":scope > td."+NUMBER_CLASS);
    let check=row.querySelector(":scope > td."+CHECK_CLASS);

    if(!check){
      check=document.createElement("td");
      check.className=CHECK_CLASS;
      check.style.textAlign="center";
      const input=document.createElement("input");
      input.type="checkbox";
      input.className="tlc-row-select";
      input.addEventListener("click",event=>event.stopPropagation());
      check.appendChild(input);
      row.insertBefore(check,row.firstChild);
    }

    if(!no){
      no=document.createElement("td");
      no.className=NUMBER_CLASS;
      no.style.textAlign="center";
      row.insertBefore(no,row.firstChild);
    }

    no.textContent=String(index);
  }

  function enhance(table){
    const headers=headerRows(table);
    headers.forEach(addHeader);
    dataRows(table,headers).forEach((row,index)=>addData(row,index+1));
  }

  function run(){
    scheduled=false;
    document.querySelectorAll("table").forEach(enhance);
  }

  function schedule(){
    if(scheduled) return;
    scheduled=true;
    setTimeout(run,0);
  }

  if(document.readyState==="loading"){
    document.addEventListener("DOMContentLoaded",run,{once:true});
  }else{
    run();
  }

  new MutationObserver(schedule).observe(document.documentElement,{
    childList:true,
    subtree:true
  });
})();
</script>

<script>
/* TLC_CUSTOMER_RECONCILIATION_LIST_INTERACTION_R1 */
(function(){
  const PAGE_SIZE=100;
  const states=new Map();
  const bodyIds=["salesBody","paymentBody","exceptionBody","historyBody"];
  let timer=0;
  function headings(table){return [...table.querySelectorAll("thead th")].filter(th=>!th.classList.contains("tlc-row-no")&&!th.classList.contains("tlc-row-check"))}
  function cells(row){return [...row.children].filter(td=>!td.classList.contains("tlc-row-no")&&!td.classList.contains("tlc-row-check"))}
  function stateFor(table){
    if(states.has(table))return states.get(table);
    const state={page:1,sortIndex:-1,direction:"asc",busy:false};states.set(table,state);
    table.dataset.reconList="1";
    const tools=document.createElement("div");tools.className="recon-list-tools";
    tools.innerHTML='<input class="recon-all" placeholder="综合检索（全字段部分匹配）"><select class="recon-field"></select><input class="recon-value" placeholder="指定字段部分匹配"><button type="button" class="recon-prev">上一页</button><button type="button" class="recon-next">下一页</button><span class="page-info"></span>';
    table.parentElement.insertBefore(tools,table);
    const select=tools.querySelector(".recon-field");headings(table).forEach((th,index)=>{th.dataset.reconSort=String(index);const option=document.createElement("option");option.value=String(index);option.textContent=th.textContent.trim();select.appendChild(option);th.addEventListener("click",()=>{state.direction=state.sortIndex===index&&state.direction==="asc"?"desc":"asc";state.sortIndex=index;state.page=1;headings(table).forEach(x=>x.removeAttribute("aria-sort"));th.setAttribute("aria-sort",state.direction==="asc"?"ascending":"descending");apply(table)})});
    tools.querySelector(".recon-all").addEventListener("input",()=>{state.page=1;apply(table)});tools.querySelector(".recon-value").addEventListener("input",()=>{state.page=1;apply(table)});select.addEventListener("change",()=>{state.page=1;apply(table)});
    tools.querySelector(".recon-prev").addEventListener("click",()=>{state.page--;apply(table)});tools.querySelector(".recon-next").addEventListener("click",()=>{state.page++;apply(table)});
    table.querySelector("tbody").addEventListener("click",event=>{if(event.target.closest("input,button,a,select"))return;const row=event.target.closest("tr");if(!row)return;table.querySelectorAll("tbody tr.recon-active").forEach(x=>x.classList.remove("recon-active"));row.classList.add("recon-active")});
    return state;
  }
  function apply(table){
    const state=stateFor(table);if(state.busy)return;state.busy=true;
    const tools=table.previousElementSibling;const all=(tools.querySelector(".recon-all").value||"").trim().toLocaleLowerCase();const field=Number(tools.querySelector(".recon-field").value||0);const value=(tools.querySelector(".recon-value").value||"").trim().toLocaleLowerCase();
    let rows=[...table.querySelectorAll("tbody tr")];
    rows.forEach(row=>{row.dataset.reconMatch=(!all||row.textContent.toLocaleLowerCase().includes(all))&&(!value||String(cells(row)[field]?.textContent||"").toLocaleLowerCase().includes(value))?"1":"0"});
    let matched=rows.filter(row=>row.dataset.reconMatch==="1");
    if(state.sortIndex>=0){matched.sort((a,b)=>{const av=String(cells(a)[state.sortIndex]?.textContent||"").trim();const bv=String(cells(b)[state.sortIndex]?.textContent||"").trim();const an=Number(av.replace(/,/g,"")),bn=Number(bv.replace(/,/g,""));const result=Number.isFinite(an)&&Number.isFinite(bn)?an-bn:av.localeCompare(bv,undefined,{numeric:true});return state.direction==="asc"?result:-result});const current=[...table.querySelectorAll("tbody tr")].filter(row=>row.dataset.reconMatch==="1");if(matched.some((row,index)=>current[index]!==row))matched.forEach(row=>row.parentElement.appendChild(row))}
    const pages=Math.max(1,Math.ceil(matched.length/PAGE_SIZE));state.page=Math.max(1,Math.min(state.page,pages));const visible=new Set(matched.slice((state.page-1)*PAGE_SIZE,state.page*PAGE_SIZE));rows.forEach(row=>row.style.display=visible.has(row)?"":"none");
    tools.querySelector(".page-info").textContent=`${matched.length} 件｜第 ${state.page} / ${pages} 页`;tools.querySelector(".recon-prev").disabled=state.page<=1;tools.querySelector(".recon-next").disabled=state.page>=pages;
    state.busy=false;
  }
  function refresh(){bodyIds.forEach(id=>{const body=document.getElementById(id);if(body){const table=body.closest("table");stateFor(table);apply(table)}})}
  function schedule(){clearTimeout(timer);timer=setTimeout(refresh,30)}
  if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",refresh,{once:true});else refresh();
  new MutationObserver(schedule).observe(document.documentElement,{childList:true,subtree:true});
})();
</script>

</body>
</html>
