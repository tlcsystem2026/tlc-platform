<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>法人主数据维护</title><style>
body{font-family:Arial,"Microsoft YaHei",sans-serif;margin:0;background:#f5f7fa;color:#1f2937}header{background:#173b63;color:#fff;padding:20px 28px}main{padding:18px;max-width:1450px;margin:auto}.card{background:#fff;border:1px solid #d9e0e8;border-radius:10px;padding:16px;margin-bottom:15px}.grid{display:grid;grid-template-columns:repeat(4,minmax(180px,1fr));gap:12px}label{display:flex;flex-direction:column;gap:5px}input,select,button{padding:9px;border:1px solid #b9c2cc;border-radius:5px}button{cursor:pointer}.primary{background:#174f83;color:#fff}.danger{background:#a42626;color:#fff}.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:end;margin:10px 0}.table{overflow:auto;max-height:48vh}table{border-collapse:collapse;width:100%}th,td{border:1px solid #d9e0e8;padding:8px;white-space:nowrap}th{background:#eaf2fb;position:sticky;top:0}.default{color:#087a3e;font-weight:bold}.muted{color:#667085;font-size:13px}.selected{background:#fff4d6}@media(max-width:850px){.grid{grid-template-columns:1fr 1fr}}/* TLC_SYSTEM_ADMIN_LIST_INTERACTION_R1 */
.tlc-unified-list-tools{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin:8px 0}.tlc-unified-list-tools input,.tlc-unified-list-tools select{width:auto!important;min-width:150px;margin:0!important}.tlc-unified-list-tools .tlc-list-page-info{margin-left:auto;color:#667085;font-size:12px}
table[data-tlc-unified-list] tbody tr{cursor:pointer}table[data-tlc-unified-list] tbody tr:hover{background:#fff4cc}table[data-tlc-unified-list] tbody tr.tlc-list-active{background:#ffe08a!important}
table[data-tlc-unified-list] th[data-tlc-list-sort]{cursor:pointer;user-select:none;white-space:nowrap}table[data-tlc-unified-list] th[data-tlc-list-sort]::after{content:' ↕';color:#8290a3;font-size:11px}table[data-tlc-unified-list] th[data-tlc-list-sort][aria-sort='ascending']::after{content:' ↑';color:#1d4ed8}table[data-tlc-unified-list] th[data-tlc-list-sort][aria-sort='descending']::after{content:' ↓';color:#1d4ed8}
</style></head><body>
<header><h1>法人主数据维护</h1><div>Legal Entity Master / 法人代码、名称、启停及默认法人管理</div></header><main>
<section class="card"><div class="grid"><label>法人代码<input id="entityId" maxlength="50"></label><label>法人名称<input id="entityName"></label><label>国家代码<input id="country" value="JP"></label><label>默认语言<select id="language"><option value="zh">中文</option><option value="ja">日本語</option><option value="en">English</option></select></label><label>启用<select id="active"><option value="true">启用</option><option value="false">停用</option></select></label><label>操作人<input id="operator" value="super-admin"></label><label>删除角色<input id="role" value="SUPER_ADMIN" readonly></label></div><div class="toolbar"><button class="primary" onclick="saveEntity()">保存</button><button onclick="clearForm()">新增／清空</button><button onclick="setDefaultEntity()">设为默认法人</button><button onclick="checkReferences()">检查关联数据</button><button class="danger" onclick="deleteEntity()">删除（超级管理员）</button><a href="/system-parameter-center">返回系统参数</a><a href="/dashboard">返回 Dashboard</a></div><div id="message" class="muted"></div></section>
<section class="card"><div class="toolbar"><label>综合检索<input id="keyword"></label><label>有效范围<select id="includeInactive"><option value="true">包含停用</option><option value="false">仅启用</option></select></label><button class="primary" onclick="loadEntities()">检索／刷新</button></div><h2>法人一览 <span id="count"></span></h2><div class="table"><table><thead><tr><th>No</th><th>法人代码</th><th>法人名称</th><th>国家</th><th>语言</th><th>状态</th><th>默认法人</th><th>创建时间</th><th>更新时间</th></tr></thead><tbody id="rows"></tbody></table></div></section>
<section class="card"><h2>最近操作记录</h2><div class="table"><table><thead><tr><th>时间</th><th>法人代码</th><th>操作</th><th>操作人</th><th>说明</th></tr></thead><tbody id="auditRows"></tbody></table></div></section>
</main><script>
let entities=[],selectedId="";const $=id=>document.getElementById(id);const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
async function api(url,options={}){const response=await fetch(url,options);const text=await response.text();let body;try{body=JSON.parse(text)}catch{body=text}if(!response.ok){const detail=body&&body.detail!==undefined?body.detail:body;const error=new Error(typeof detail==="string"?detail:(detail&&detail.message)||response.statusText);error.detail=detail;throw error}return body}
function payload(){return{id:$('entityId').value.trim(),name:$('entityName').value.trim(),country:$('country').value.trim(),language:$('language').value,active:$('active').value==="true",operator:$('operator').value.trim()}}
function clearForm(){selectedId="";$('entityId').readOnly=false;$('entityId').value="";$('entityName').value="";$('country').value="JP";$('language').value="zh";$('active').value="true";$('message').textContent=""}
function selectEntity(id){const row=entities.find(item=>item.id===id);if(!row)return;selectedId=id;$('entityId').value=row.id;$('entityId').readOnly=true;$('entityName').value=row.name;$('country').value=row.country;$('language').value=row.language;$('active').value=String(!!row.active);document.querySelectorAll('#rows tr').forEach(tr=>tr.classList.toggle('selected',tr.dataset.id===id))}
async function loadEntities(){try{const q=new URLSearchParams({keyword:$('keyword').value.trim(),include_inactive:$('includeInactive').value});entities=await api('/api/legal-entities?'+q);$('count').textContent=entities.length+' 件';$('rows').innerHTML=entities.map((x,i)=>`<tr data-id="${esc(x.id)}" onclick="selectEntity('${esc(x.id)}')"><td>${i+1}</td><td>${esc(x.id)}</td><td>${esc(x.name)}</td><td>${esc(x.country)}</td><td>${esc(x.language)}</td><td>${x.active?'启用':'停用'}</td><td class="${x.is_default?'default':''}">${x.is_default?'默认':''}</td><td>${esc(x.created_at)}</td><td>${esc(x.updated_at)}</td></tr>`).join('');await loadAudit()}catch(e){$('message').textContent=e.message}}
async function saveEntity(){try{await api('/api/legal-entities',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload())});$('message').textContent='保存完成';clearForm();await loadEntities()}catch(e){alert(e.message)}}
async function setDefaultEntity(){const id=$('entityId').value.trim();if(!id)return alert('请先选择法人');if(!confirm(`将 ${id} 设为系统默认法人吗？`))return;try{await api('/api/legal-entities/'+encodeURIComponent(id)+'/default',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({operator:$('operator').value.trim()})});$('message').textContent='默认法人设置完成';await loadEntities()}catch(e){alert(e.message)}}
function referenceText(result){if(!result.references.length)return '没有发现关联业务数据';return result.references.map(x=>`${x.table}.${x.column}：${x.count}件`).join('\n')}
async function checkReferences(){const id=$('entityId').value.trim();if(!id)return alert('请先选择法人');try{const result=await api('/api/legal-entities/'+encodeURIComponent(id)+'/references');alert(referenceText(result))}catch(e){alert(e.message)}}
async function deleteEntity(){const id=$('entityId').value.trim();if(!id)return alert('请先选择法人');if(!confirm(`确认删除法人 ${id} 吗？存在关联数据或属于默认法人时不能删除。`))return;try{const q=new URLSearchParams({operator:$('operator').value.trim(),role:$('role').value});await api('/api/legal-entities/'+encodeURIComponent(id)+'?'+q,{method:'DELETE'});$('message').textContent='法人删除完成';clearForm();await loadEntities()}catch(e){const d=e.detail;if(d&&d.references)alert(`${d.message}\n${d.references.slice(0,10).map(x=>`${x.table}.${x.column}：${x.count}件`).join('\n')}`);else alert(e.message)}}
async function loadAudit(){const rows=await api('/api/legal-entities-audit?limit=100');$('auditRows').innerHTML=rows.map(x=>`<tr><td>${esc(x.created_at)}</td><td>${esc(x.legal_entity_id)}</td><td>${esc(x.action)}</td><td>${esc(x.operator)}</td><td>${esc(x.detail)}</td></tr>`).join('')}
loadEntities();
</script><script>
/* TLC_SYSTEM_ADMIN_LIST_INTERACTION_R1 */
(function(){
 const PAGE_SIZE=100,states=new Map();let timer=0;
 function businessHeaders(table){return [...table.querySelectorAll("thead th")].filter(th=>!th.classList.contains("tlc-row-no")&&!th.classList.contains("tlc-row-check"))}
 function businessCells(row){return [...row.children].filter(td=>!td.classList.contains("tlc-row-no")&&!td.classList.contains("tlc-row-check"))}
 function init(table){
  if(states.has(table))return states.get(table);if(!table.querySelector("thead")||!table.querySelector("tbody"))return null;
  const state={page:1,sort:-1,dir:"asc",busy:false};states.set(table,state);table.dataset.tlcUnifiedList="1";
  const tools=document.createElement("div");tools.className="tlc-unified-list-tools";tools.innerHTML='<input class="tlc-list-all" placeholder="综合检索（全字段部分匹配）"><select class="tlc-list-field"></select><input class="tlc-list-value" placeholder="指定字段部分匹配"><button type="button" class="tlc-list-prev">上一页</button><button type="button" class="tlc-list-next">下一页</button><span class="tlc-list-page-info"></span>';
  table.parentElement.insertBefore(tools,table);const select=tools.querySelector(".tlc-list-field");businessHeaders(table).forEach((th,index)=>{const option=document.createElement("option");option.value=String(index);option.textContent=th.textContent.trim()||`列${index+1}`;select.appendChild(option);if(th.querySelector("input,button,select"))return;th.dataset.tlcListSort=String(index);th.addEventListener("click",()=>{state.dir=state.sort===index&&state.dir==="asc"?"desc":"asc";state.sort=index;state.page=1;businessHeaders(table).forEach(x=>x.removeAttribute("aria-sort"));th.setAttribute("aria-sort",state.dir==="asc"?"ascending":"descending");apply(table)})});
  tools.querySelector(".tlc-list-all").addEventListener("input",()=>{state.page=1;apply(table)});tools.querySelector(".tlc-list-value").addEventListener("input",()=>{state.page=1;apply(table)});select.addEventListener("change",()=>{state.page=1;apply(table)});tools.querySelector(".tlc-list-prev").addEventListener("click",()=>{state.page--;apply(table)});tools.querySelector(".tlc-list-next").addEventListener("click",()=>{state.page++;apply(table)});
  table.querySelector("tbody").addEventListener("click",event=>{if(event.target.closest("input,button,a,select,label,textarea"))return;const row=event.target.closest("tr");if(!row)return;table.querySelectorAll("tbody tr.tlc-list-active").forEach(x=>x.classList.remove("tlc-list-active"));row.classList.add("tlc-list-active")});return state;
 }
 function apply(table){
  const state=init(table);if(!state||state.busy)return;state.busy=true;const tools=table.previousElementSibling;if(!tools?.classList.contains("tlc-unified-list-tools")){state.busy=false;return}const all=tools.querySelector(".tlc-list-all").value.trim().toLocaleLowerCase(),field=Number(tools.querySelector(".tlc-list-field").value||0),value=tools.querySelector(".tlc-list-value").value.trim().toLocaleLowerCase();let rows=[...table.querySelectorAll("tbody tr")];rows.forEach(row=>row.dataset.tlcListMatch=(!all||row.textContent.toLocaleLowerCase().includes(all))&&(!value||String(businessCells(row)[field]?.textContent||"").toLocaleLowerCase().includes(value))?"1":"0");let matched=rows.filter(row=>row.dataset.tlcListMatch==="1");
  if(state.sort>=0){matched.sort((a,b)=>{const av=String(businessCells(a)[state.sort]?.textContent||"").trim(),bv=String(businessCells(b)[state.sort]?.textContent||"").trim(),an=Number(av.replace(/,/g,"")),bn=Number(bv.replace(/,/g,""));const result=Number.isFinite(an)&&Number.isFinite(bn)?an-bn:av.localeCompare(bv,undefined,{numeric:true});return state.dir==="asc"?result:-result});const current=rows.filter(row=>row.dataset.tlcListMatch==="1");if(matched.some((row,i)=>current[i]!==row))matched.forEach(row=>row.parentElement.appendChild(row))}
  const pages=Math.max(1,Math.ceil(matched.length/PAGE_SIZE));state.page=Math.max(1,Math.min(state.page,pages));const visible=new Set(matched.slice((state.page-1)*PAGE_SIZE,state.page*PAGE_SIZE));rows.forEach(row=>row.style.display=visible.has(row)?"":"none");tools.querySelector(".tlc-list-page-info").textContent=`${matched.length} 件｜第 ${state.page} / ${pages} 页`;tools.querySelector(".tlc-list-prev").disabled=state.page<=1;tools.querySelector(".tlc-list-next").disabled=state.page>=pages;state.busy=false;
 }
 function refresh(){document.querySelectorAll("table").forEach(table=>{init(table);apply(table)})}function schedule(){clearTimeout(timer);timer=setTimeout(refresh,35)}if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",refresh,{once:true});else refresh();new MutationObserver(schedule).observe(document.documentElement,{childList:true,subtree:true});
})();
</script></body></html>
