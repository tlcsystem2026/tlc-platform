<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>月度业务引导</title>
<style>
:root{--blue:#28527a;--green:#26734d;--amber:#a15c00;--red:#a61b1b;--bg:#f4f6f8;--border:#d7dee5}*{box-sizing:border-box}
body{font-family:"Microsoft YaHei","Segoe UI",sans-serif;margin:0;background:var(--bg);color:#1f2937}header{background:linear-gradient(90deg,#203b55,#28527a);color:#fff;padding:22px 28px}header h1{margin:0 0 7px}header p{margin:0;opacity:.9}
main{max-width:1300px;margin:auto;padding:18px}.card{background:#fff;border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:15px}.toolbar{display:flex;gap:10px;align-items:end;flex-wrap:wrap}label{font-size:13px;color:#667085}input,button{display:block;padding:9px;border:1px solid #b8c2cc;border-radius:6px}button,.button{cursor:pointer;background:var(--blue);color:#fff;text-decoration:none;padding:9px 13px;border-radius:6px;font-weight:700}.button.secondary{background:#64748b}
.progress{height:20px;background:#e4e9ee;border-radius:10px;overflow:hidden;margin-top:8px}.progress>div{height:100%;background:linear-gradient(90deg,#2b6cb0,#2f855a);width:0;transition:.2s}.step{display:grid;grid-template-columns:48px 1fr 150px;gap:13px;align-items:center;border:1px solid var(--border);border-radius:10px;padding:13px;margin:10px 0}.step.done{background:#effaf3}.step.attention{background:#fff1f0;border-color:#f0a6a6}.step.in_progress{background:#fff8e6}.step.recommended{box-shadow:0 0 0 2px var(--blue)}.no{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#e7edf3;font-weight:800}.done .no{background:#cfead8}.status{font-weight:800}.done .status{color:var(--green)}.attention .status{color:var(--red)}.in_progress .status{color:var(--amber)}.small{font-size:12px;color:#667085;line-height:1.7}.alert{border-left:5px solid var(--amber);padding:9px 12px;margin:7px 0;background:#fff8e6}.alert.high{border-color:var(--red);background:#fff1f0}.legend{display:flex;gap:15px;flex-wrap:wrap;font-size:13px;color:#667085}
@media(max-width:760px){.step{grid-template-columns:40px 1fr}.step>div:last-child{grid-column:2}.button{display:inline-block}}
</style></head><body>
<header><h1>月度业务引导</h1><p>按当前真实业务页面依次确认：主数据 → 文件核对 → 业务审核 → 正式销售 → 银行流水 → 客户匹配 → 对账 → 月结</p></header>
<main>
<section class="card"><div class="toolbar"><label>业务年月<input id="businessMonth" type="month"></label><button onclick="loadWorkflow()">刷新进度</button><a class="button secondary" href="/dashboard">返回 Dashboard</a><a class="button secondary" href="/operational-exception-dashboard" target="_blank">异常中心</a></div></section>
<section class="card"><div id="progressText">加载中...</div><div class="progress"><div id="progressBar"></div></div><div class="legend"><span>DONE：完成</span><span>PENDING：未开始／未完成</span><span>IN_PROGRESS：处理中</span><span>ATTENTION：存在异常</span></div></section>
<section class="card"><h2>本月业务步骤</h2><div id="steps"></div></section>
<section class="card"><h2>当前需要关注</h2><div id="alerts"></div></section>
</main>
<script>
const byId=id=>document.getElementById(id);const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const statusLabel={DONE:"已完成",PENDING:"待处理",IN_PROGRESS:"处理中",ATTENTION:"有异常"};
async function loadWorkflow(){const month=byId("businessMonth").value;const q=month?`?business_month=${encodeURIComponent(month)}`:"";try{const r=await fetch("/api/tlc-guided-monthly-workflow"+q);const data=await r.json();if(!r.ok)throw new Error(data.detail||r.statusText);if(!byId("businessMonth").value&&data.business_month)byId("businessMonth").value=data.business_month;byId("progressText").innerHTML=`完成 <b>${data.completed_step_count}/${data.total_step_count}</b>（${data.progress_percent}%）${data.all_complete?'，本月流程已全部完成':''}`;byId("progressBar").style.width=`${data.progress_percent}%`;byId("steps").innerHTML=data.steps.map(x=>`<div class="step ${x.status.toLowerCase()} ${x.recommended?'recommended':''}"><div class="no">${x.order}</div><div><b>${esc(x.name)}</b>${x.recommended?' <span class="small">← 建议下一步</span>':''}<br><span class="small">${esc(x.description)}</span><br><span class="small">${esc(x.detail)}</span></div><div><div class="status">${esc(statusLabel[x.status]||x.status)}</div><a class="button" href="${esc(x.path)}" target="_blank">打开业务页面</a></div></div>`).join("");byId("alerts").innerHTML=data.alerts.length?data.alerts.map(x=>`<div class="alert ${String(x.severity).toLowerCase()}"><b>${esc(x.code)}</b>：${esc(x.message)}　<a href="${esc(x.target)}" target="_blank">去处理</a></div>`).join(""):'<span class="small">当前没有需要特别关注的异常。</span>';}catch(error){byId("progressText").textContent=error.message}}
const now=new Date();byId("businessMonth").value=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,"0")}`;loadWorkflow();
</script></body></html>
