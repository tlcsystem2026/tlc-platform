<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>客户多语言名称维护</title><style>body{font-family:"Microsoft YaHei",sans-serif;margin:0;background:#f4f7fb;color:#172033}header{background:#173f78;color:white;padding:22px 30px}main{padding:20px}.card{background:white;border:1px solid #d8e0eb;border-radius:14px;padding:18px;margin-bottom:16px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;align-items:end}label{display:flex;flex-direction:column;gap:5px}input,select,button{padding:9px;border:1px solid #b9c4d4;border-radius:7px}button{cursor:pointer}.primary{background:#174b83;color:white}.selected-customer{background:#eef6ff;padding:10px;border-radius:8px;min-height:20px}table{width:100%;border-collapse:collapse;margin-top:12px}th,td{border:1px solid #d9e0e8;padding:7px}th{background:#eaf1f9}.sortable{cursor:pointer}.sortable.active{background:#cfe3fa}.row{cursor:pointer}.row:hover,.row.active{background:#fff1a8}.small{font-size:12px;color:#667085}.pager{display:flex;gap:8px;align-items:center;margin-top:10px}.modal{display:none;position:fixed;inset:0;background:#0008;padding:5vh 5vw}.modal.open{display:block}.modal-card{background:white;border-radius:14px;padding:18px;max-height:85vh;overflow:auto}</style></head><body><header><a href="/dashboard" style="color:white">← Dashboard</a><h1>客户多语言名称维护</h1><p>一个客户统一管理请求书中文／日文名称、银行汇款人名称、历史名称及简称。</p></header><main><section class="card"><h2>业务说明</h2><p>请求书名称登记为“请求书使用名称”；银行 CSV 汇款人登记为“银行汇款人名称”。确认一次后，后续请求书和银行流水会自动匹配同一个客户，不需要反复合并客户。</p></section><section class="card"><h2>名称检索</h2><div class="grid"><label>综合检索<input id="q" placeholder="客户编号、正式名称、登记名称"></label><label>名称类型<select id="type"><option value="">全部类型</option><option value="FORMAL">正式名称</option><option value="REQUEST_NAME">请求书使用名称</option><option value="BANK_REMITTER">银行汇款人名称</option><option value="HISTORICAL">历史名称</option><option value="SHORT_NAME">简称</option><option value="DELIVERY_NAME">配送名称</option></select></label><label>语言<input id="lang" placeholder="zh / ja"></label><button class="primary" onclick="load()">检索</button><button onclick="clearSearch()">清除</button></div></section><section class="card"><h2>新增名称</h2><div class="grid"><button class="primary" onclick="openCustomerReference()">参照并选择客户</button><div id="selectedCustomer" class="selected-customer">尚未选择客户</div><label>名称<input id="name" placeholder="请求书或银行中实际出现的名称"></label><label>名称类型<select id="newType"><option value="REQUEST_NAME">请求书使用名称</option><option value="BANK_REMITTER">银行汇款人名称</option><option value="HISTORICAL">历史名称</option><option value="SHORT_NAME">简称</option><option value="DELIVERY_NAME">配送名称</option></select></label><label>语言<input id="newLang" placeholder="zh / ja"></label><label>操作人<input id="actor"></label><button class="primary" onclick="add()">登记</button></div><p class="small">同一标准化名称只能属于一个有效客户。正式名称请在客户维护页面修改。</p></section><section class="card"><h2>名称一览 <span id="count"></span></h2><table><thead><tr><th>No</th><th class="sortable" data-key="customer_id" onclick="sortBy('customer_id')">客户编号</th><th class="sortable" data-key="customer_formal_name" onclick="sortBy('customer_formal_name')">客户正式名称</th><th class="sortable" data-key="name_value" onclick="sortBy('name_value')">登记名称</th><th class="sortable" data-key="name_type" onclick="sortBy('name_type')">类型</th><th>语言</th><th>来源</th><th>状态</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table><div class="pager"><button onclick="pageTo(1)">首页</button><button onclick="pageTo(page-1)">上一页</button><span id="pageInfo"></span><button onclick="pageTo(page+1)">下一页</button><button onclick="pageTo(totalPages)">末页</button></div></section></main><div id="customerModal" class="modal"><div class="modal-card"><h2>客户参照／选择</h2><div class="grid"><label>全字段部分匹配<input id="customerQuery"></label><button class="primary" onclick="searchCustomers()">检索</button><button onclick="customerModal.classList.remove('open')">关闭</button></div><table><thead><tr><th>客户编号</th><th>正式名称</th><th>简称</th><th>选择</th></tr></thead><tbody id="customerRows"></tbody></table></div></div><script>const PAGE_SIZE=100,labels={FORMAL:'正式名称',REQUEST_NAME:'请求书使用名称',BANK_REMITTER:'银行汇款人名称',HISTORICAL:'历史名称',SHORT_NAME:'简称',DELIVERY_NAME:'配送名称'};let data=[],page=1,totalPages=1,sortKey='customer_id',direction=1,customerRecordId='',customerId='';const e=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function api(u,o){const r=await fetch(u,o),b=await r.json();if(!r.ok)throw Error(b.detail||JSON.stringify(b));return b}async function load(){try{const p=new URLSearchParams({query:q.value,name_type:type.value,language_code:lang.value,include_inactive:'true'});data=await api('/api/customer-name-identities?'+p);page=1;render()}catch(x){alert(x.message)}}function render(){data.sort((a,b)=>String(a[sortKey]??'').localeCompare(String(b[sortKey]??''),'zh')*direction);totalPages=Math.max(1,Math.ceil(data.length/PAGE_SIZE));page=Math.min(Math.max(1,page),totalPages);const start=(page-1)*PAGE_SIZE;count.textContent=data.length+' 件';rows.innerHTML=data.slice(start,start+PAGE_SIZE).map((x,i)=>`<tr class="row" onclick="this.classList.toggle('active')"><td>${start+i+1}</td><td>${e(x.customer_id)}</td><td>${e(x.customer_formal_name)}</td><td>${e(x.name_value)}</td><td>${e(labels[x.name_type]||x.name_type)}</td><td>${e(x.language_code)}</td><td>${e(x.source_system)}</td><td>${x.active?'有效':'无效'}</td><td>${x.active&&x.name_type!=='FORMAL'?`<button onclick="event.stopPropagation();disableName('${e(x.id)}')">停用</button>`:''}</td></tr>`).join('');pageInfo.textContent=`第 ${page} / ${totalPages} 页`;document.querySelectorAll('.sortable').forEach(th=>{th.classList.toggle('active',th.dataset.key===sortKey);th.textContent=th.textContent.replace(/[↑↓]$/,'')+(th.dataset.key===sortKey?(direction===1?'↑':'↓'):'')})}function sortBy(k){if(sortKey===k)direction*=-1;else{sortKey=k;direction=1}render()}function pageTo(p){page=Math.min(Math.max(1,p),totalPages);render()}function clearSearch(){q.value=type.value=lang.value='';load()}function openCustomerReference(){customerModal.classList.add('open');searchCustomers()}async function searchCustomers(){try{const list=await api('/api/tlc-customers?query='+encodeURIComponent(customerQuery.value)+'&include_inactive=false&limit=0');customerRows.innerHTML=list.map(x=>`<tr><td>${e(x.customer_id)}</td><td>${e(x.formal_name)}</td><td>${e(x.short_name)}</td><td><button onclick="chooseCustomer('${e(x.id)}','${e(x.customer_id)}','${e(x.formal_name)}')">选择</button></td></tr>`).join('')}catch(x){alert(x.message)}}function chooseCustomer(id,code,formal){customerRecordId=id;customerId=code;selectedCustomer.textContent=`${code} / ${formal}`;customerModal.classList.remove('open')}async function add(){if(!customerRecordId){alert('请先参照并选择客户');return}try{await api('/api/customer-name-identities',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({customer_record_id:customerRecordId,customer_id:customerId,name_value:name.value,name_type:newType.value,language_code:newLang.value,actor:actor.value})});name.value='';await load()}catch(x){alert(x.message)}}async function disableName(id){const reason=prompt('停用理由');if(!reason)return;try{await api(`/api/customer-name-identities/${id}/deactivate`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({actor:actor.value,reason})});await load()}catch(x){alert(x.message)}}load()</script></body></html>

<script>
(function(){
 function replaceLanguageInput(id,options){
  var old=document.getElementById(id);if(!old||old.tagName==='SELECT')return;
  var select=document.createElement('select');select.id=id;
  options.forEach(function(item){var option=document.createElement('option');option.value=item[0];option.textContent=item[1];select.appendChild(option)});
  old.replaceWith(select);
 }
 replaceLanguageInput('lang',[['','全部语言'],['zh','中文 zh'],['ja','日文 ja'],['und','无法区分 und']]);
 replaceLanguageInput('newLang',[['auto','自动判断'],['zh','中文 zh'],['ja','日文 ja'],['und','无法区分 und']]);
 window.add=async function(){
  if(!customerRecordId){alert('请先参照并选择客户');return}
  var nameInput=document.getElementById('name'),value=nameInput.value.trim();
  if(!value){alert('请输入名称');return}
  try{
   await api('/api/customer-name-identities',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({customer_record_id:customerRecordId,customer_id:customerId,name_value:value,name_type:newType.value,language_code:newLang.value,actor:actor.value})});
   nameInput.value='';await load();alert('名称登记完成');
  }catch(x){alert(x.message)}
 };
})();
</script>
