<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>客户候选提取与审核中心</title>
<style>
body{font-family:"Microsoft YaHei","Segoe UI",sans-serif;margin:0;background:#f5f7fb;color:#172033}header{background:#173a70;color:#fff;padding:22px 30px}main{padding:22px;max-width:1600px;margin:auto}.card{background:#fff;border:1px solid #dce3ed;border-radius:14px;padding:18px;margin-bottom:18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}label{display:block;font-size:13px;color:#526174}input,select{width:100%;box-sizing:border-box;padding:9px;border:1px solid #bcc7d6;border-radius:7px;margin-top:5px}button{padding:9px 14px;border:0;border-radius:7px;background:#1759a6;color:#fff;cursor:pointer}.secondary{background:#64748b}.danger{background:#a32222}.bar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-top:14px}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:14px}.stat{background:#edf4fd;padding:12px;border-radius:8px}.table-wrap{overflow:auto;max-height:640px}table{border-collapse:collapse;width:100%;font-size:13px}th,td{border:1px solid #d8e0ea;padding:7px;white-space:nowrap}th{background:#e8f0fa;position:sticky;top:0}.matched{color:#08765b}.wait{color:#a15c00}.message{margin-left:8px;color:#31506f}
.formal-name-input{width:380px;min-width:380px}.row-check{width:auto;margin:0}.business-note{background:#f0f6ff;border-left:4px solid #1759a6;padding:12px;line-height:1.7}.selected-count{font-weight:700;color:#1759a6}
</style></head><body>
<header><h1>客户基础数据准备</h1><div>在请求书正式导入前，只读扫描 Incoming/YYYYMM，提取收件方正式名称并准备客户主数据。</div></header>
<main>
<section class="card"><h2>客户候选提取 Batch</h2><div class="grid">
<label>业务年月<input id="month" maxlength="6" placeholder="YYYYMM"></label>
<label>操作人<input id="operator"></label>
</div><div class="business-note">文件来源使用系统参数中的请求书 Incoming 目录。本 Batch 不移动、不删除 PDF／Excel，也不执行金额核对或请求书导入。<br><b>导出候选 CSV</b>用于在 Excel 中离线整理建议正式名称、处理动作和备注；<b>导入审核结果 CSV</b>只把这些审核内容写回候选表，不会自动创建、关联或删除客户。导入后仍需勾选候选并执行下方批量操作。</div><div class="bar"><button onclick="runBatch()">扫描文件并提取客户</button><button class="secondary" onclick="refreshAll()">刷新</button><button class="secondary" onclick="exportCsv()">导出候选 CSV</button><input type="file" id="csvFile" accept=".csv" style="max-width:260px"><button class="secondary" onclick="importCsv()">导入审核结果 CSV</button><span id="message" class="message"></span></div><div id="stats" class="stats"></div><pre id="batchMessage"></pre></section>
<section class="card"><h2>客户候选审核</h2><div class="bar"><label>状态<select id="status" onchange="loadCandidates()"><option value="">全部</option><option>WAIT_REVIEW</option><option>MATCHED</option><option>IMPORTED</option><option>ON_HOLD</option><option>REJECTED</option></select></label><span id="selectedCount" class="selected-count">已选择 0 件</span><button onclick="bulkAction('LINK_EXISTING')">批量关联自动匹配客户</button><button onclick="bulkAction('CREATE_NEW')">批量创建客户</button><button class="secondary" onclick="bulkAction('HOLD')">批量暂缓</button><button class="danger" onclick="bulkAction('REJECT')">批量排除</button></div><div class="table-wrap"><table id="customerCandidateTable"><thead><tr><th>No</th><th><input class="row-check" type="checkbox" id="selectAll" onchange="toggleAll(this.checked)"></th><th>原始客户名</th><th style="min-width:400px">建议正式名称</th><th>来源请求书文件</th><th>出现次数</th><th>匹配客户</th><th>匹配</th><th>状态</th></tr></thead><tbody id="rows"></tbody></table></div></section>
</main>
<script data-tlc-contract="TLC_CUSTOMER_CANDIDATE_BULK_REVIEW_R1">
const $=id=>document.getElementById(id);let activeBatch='';let selected=new Set();let currentRows=[];
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
async function api(url,opt={}){const r=await fetch(url,{credentials:'same-origin',...opt});const body=await r.json().catch(()=>({}));if(!r.ok)throw new Error(body.detail?.message||body.detail||r.statusText);return body;}
function say(v){$('message').textContent=v;}
async function runBatch(){try{say('扫描中…');const b=await api('/api/customer-candidates/batches',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({business_month:$('month').value,operator:$('operator').value})});activeBatch=b.id;say('提取完成');renderStats(b);await loadCandidates();}catch(e){alert(e.message);say('执行失败');}}
function renderStats(b){$('stats').innerHTML=[['来源请求书',b.source_rows],['候选',b.candidate_count],['自动匹配',b.matched_count],['待审核',b.review_count],['提取错误',b.conflict_count]].map(x=>`<div class="stat"><b>${esc(x[0])}</b><div>${esc(x[1]||0)}</div></div>`).join('');$('batchMessage').textContent=(b.source_directory||'')+'\n'+(b.message||'');}
async function refreshAll(){try{const q=new URLSearchParams({business_month:$('month').value});const b=await api('/api/customer-candidates/batches/latest?'+q);activeBatch=b.id||'';renderStats(b);await loadCandidates();say('刷新完成');}catch(e){alert(e.message);}}
async function loadCandidates(){const q=new URLSearchParams({business_month:$('month').value,status:$('status').value,batch_id:activeBatch,limit:'5000'});currentRows=await api('/api/customer-candidates?'+q);const visible=new Set(currentRows.map(x=>x.id));selected=new Set([...selected].filter(id=>visible.has(id)));$('rows').innerHTML=currentRows.map((x,i)=>`<tr><td>${i+1}</td><td><input class="row-check candidate-select" type="checkbox" value="${x.id}" ${selected.has(x.id)?'checked':''} onchange="toggleOne('${x.id}',this.checked)"></td><td>${esc(x.raw_customer_name)}</td><td><input class="formal-name-input" id="f-${x.id}" value="${esc(x.suggested_formal_name)}" onchange="saveFormalName('${x.id}',this.value)"></td><td>${esc(x.source_pair_keys).replaceAll('\n','<br>')}</td><td>${esc(x.source_count)}</td><td>${esc(x.matched_customer_code)} ${esc(x.matched_customer_name)}</td><td>${esc(x.match_type)} ${esc(x.match_score)}</td><td class="${x.review_status==='MATCHED'?'matched':'wait'}">${esc(x.review_status)}</td></tr>`).join('');updateSelection();}
function toggleOne(id,checked){checked?selected.add(id):selected.delete(id);updateSelection();}
function toggleAll(checked){currentRows.forEach(x=>checked?selected.add(x.id):selected.delete(x.id));document.querySelectorAll('.candidate-select').forEach(x=>x.checked=checked);updateSelection();}
function updateSelection(){$('selectedCount').textContent=`已选择 ${selected.size} 件`;$('selectAll').checked=currentRows.length>0&&currentRows.every(x=>selected.has(x.id));}
function saveFormalName(id,value){const row=currentRows.find(x=>x.id===id);if(row)row.suggested_formal_name=value;}
async function bulkAction(action){const reviewer=$('operator').value.trim();if(!reviewer){alert('请输入操作人');return;}if(!selected.size){alert('请先选择客户候选');return;}const labels={LINK_EXISTING:'关联自动匹配客户',CREATE_NEW:'创建客户',HOLD:'暂缓',REJECT:'排除'};if(!confirm(`确认对 ${selected.size} 件候选执行“${labels[action]}”吗？`))return;const comment=prompt('批量审核备注（可以留空）')||'';try{const formal_names={};currentRows.forEach(x=>{if(selected.has(x.id)&&$('f-'+x.id))formal_names[x.id]=$('f-'+x.id).value;});const result=await api('/api/customer-candidates/bulk-resolve',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({candidate_ids:[...selected],action,reviewer,comment,formal_names})});let msg=`请求 ${result.requested} 件；成功 ${result.succeeded} 件；失败 ${result.failed} 件。`;if(result.failure_items?.length)msg+='\n\n失败明细：\n'+result.failure_items.map(x=>`${x.name||x.id}: ${x.message}`).join('\n');alert(msg);selected.clear();await loadCandidates();}catch(e){alert(e.message);}}
function exportCsv(){const q=new URLSearchParams({business_month:$('month').value,status:$('status').value,batch_id:activeBatch});location.href='/api/customer-candidates/export.csv?'+q;}
async function importCsv(){const file=$('csvFile').files[0];if(!file){alert('请选择审核结果 CSV');return;}try{const result=await api('/api/customer-candidates/import.csv?actor='+encodeURIComponent($('operator').value),{method:'POST',headers:{'Content-Type':'text/csv'},body:await file.arrayBuffer()});alert(`审核内容回写 ${result.updated} 件。尚未执行客户创建或关联，请选择候选后执行批量操作。`);await loadCandidates();}catch(e){alert(e.message);}}
const d=new Date();$('month').value=String(d.getFullYear())+String(d.getMonth()+1).padStart(2,'0');
</script></body></html>
