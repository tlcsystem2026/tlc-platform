<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>我的资料</title><style>body{background:#f5f7fb;font-family:"Microsoft YaHei"}main{max-width:800px;margin:40px auto;background:#fff;padding:24px;border-radius:14px}dt{color:#64748b}dd{margin:4px 0 14px}button,a{display:inline-block;padding:10px 14px;margin-right:8px;background:#1d4ed8;color:#fff;border:0;border-radius:7px;text-decoration:none}</style></head><body><main><h1>我的资料</h1><dl id="profile"></dl><a href="/change-password">修改密码</a><a href="/security-center">MFA与会话安全</a><a href="/dashboard">Dashboard</a><button onclick="logout()">退出登录</button></main><script>fetch('/api/auth/me').then(r=>r.json()).then(x=>profile.innerHTML=`<dt>员工编号</dt><dd>${x.employee_no||''}</dd><dt>登录ID</dt><dd>${x.login_id||''}</dd><dt>中文姓名</dt><dd>${x.name_zh||''}</dd><dt>日文姓名</dt><dd>${x.name_ja||''}</dd><dt>英文姓名</dt><dd>${x.name_en||''}</dd><dt>邮箱</dt><dd>${x.email||''}</dd><dt>手机</dt><dd>${x.mobile||''}</dd><dt>法人／部门</dt><dd>${x.legal_entity_id||''} / ${x.department_id||''}</dd>`);async function logout(){await fetch('/api/auth/logout',{method:'POST'});location.href='/login'}</script></body></html>
