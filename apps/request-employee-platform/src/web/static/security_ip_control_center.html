<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IP访问控制</title>
<style>body{font-family:"Microsoft YaHei",sans-serif;background:#f5f7fb;color:#172033;margin:0}header{background:#173a70;color:white;padding:22px 30px}main{padding:20px;max-width:1500px;margin:auto}.card{background:white;border:1px solid #dce3ed;border-radius:14px;padding:18px;margin-bottom:16px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}input,select,button{padding:9px;border:1px solid #bcc7d6;border-radius:8px}button{background:#174a7e;color:white;cursor:pointer}button.danger{background:#a32121}table{width:100%;border-collapse:collapse;margin-top:12px}th,td{border:1px solid #dce3ed;padding:8px;text-align:left}.warn{background:#fff3cd;padding:12px;border-radius:8px}.ok{color:#087443;font-weight:bold}</style></head><body>
<header><h1>IP访问控制</h1><div>SECURITY IP CONTROL R1</div></header><main>
<div class="warn"><b>当前模式：监控模式</b>。违规访问只记录，不阻断。正式阻断将在下一版通过防锁死流程启用。</div>
<section class="card"><h2>当前访问</h2><pre id="current">加载中...</pre></section>
<section class="card"><h2>IP／CIDR规则</h2><div class="grid"><input id="rName" placeholder="规则名称"><input id="rNetwork" placeholder="IP或CIDR，例如 192.168.1.0/24"><select id="rDecision"><option>ALLOW</option><option>DENY</option></select><select id="rScope"><option>GLOBAL</option><option>LOCAL</option><option>LEGAL_ENTITY</option><option>DEPARTMENT</option><option>USER</option></select><input id="rScopeId" placeholder="范围ID（按需）"><input id="rNote" placeholder="说明"><button onclick="saveRule()">保存规则</button></div><table><thead><tr><th>名称</th><th>网络</th><th>判断</th><th>范围</th><th>范围ID</th><th>启用</th><th></th></tr></thead><tbody id="rules"></tbody></table></section>
<section class="card"><h2>可信代理</h2><div class="grid"><input id="pName" placeholder="代理名称"><input id="pNetwork" placeholder="代理IP或CIDR"><input id="pNote" placeholder="说明"><button onclick="saveProxy()">保存可信代理</button></div><table><thead><tr><th>名称</th><th>网络</th><th>启用</th><th></th></tr></thead><tbody id="proxies"></tbody></table></section>
<section class="card"><h2>最近监控审计</h2><table><thead><tr><th>时间</th><th>用户</th><th>直接IP</th><th>有效IP</th><th>判断</th><th>路径</th></tr></thead><tbody id="audit"></tbody></table></section>
</main><script>
const $=id=>document.getElementById(id);async function api(url,opt){const r=await fetch(url,opt);const body=await r.json().catch(()=>({}));if(!r.ok)throw new Error(typeof body.detail==='string'?body.detail:JSON.stringify(body.detail||body));return body}const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function load(){const d=await api('/api/security-ip-control/overview');$('current').textContent=JSON.stringify(d.current_access,null,2);$('rules').innerHTML=d.rules.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.network)}</td><td>${esc(x.decision)}</td><td>${esc(x.scope_type)}</td><td>${esc(x.scope_id)}</td><td>${x.enabled?'是':'否'}</td><td><button class="danger" onclick="delRule('${esc(x.id)}')">删除</button></td></tr>`).join('');$('proxies').innerHTML=d.trusted_proxies.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.network)}</td><td>${x.enabled?'是':'否'}</td><td><button class="danger" onclick="delProxy('${esc(x.id)}')">删除</button></td></tr>`).join('');$('audit').innerHTML=d.audit.map(x=>`<tr><td>${esc(x.created_at)}</td><td>${esc(x.user_id)}</td><td>${esc(x.direct_ip)}</td><td>${esc(x.effective_ip)}</td><td>${esc(x.decision)}</td><td>${esc(x.path)}</td></tr>`).join('')}
async function saveRule(){await api('/api/security-ip-control/rules',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:$('rName').value,network:$('rNetwork').value,decision:$('rDecision').value,scope_type:$('rScope').value,scope_id:$('rScopeId').value,note:$('rNote').value})});await load()}async function saveProxy(){await api('/api/security-ip-control/trusted-proxies',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:$('pName').value,network:$('pNetwork').value,note:$('pNote').value})});await load()}async function delRule(id){if(confirm('确认删除此规则？')){await api('/api/security-ip-control/rules/'+id,{method:'DELETE'});await load()}}async function delProxy(id){if(confirm('确认删除此可信代理？')){await api('/api/security-ip-control/trusted-proxies/'+id,{method:'DELETE'});await load()}}load().catch(e=>alert(e.message));
</script></body></html>
