<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IP访问控制</title>
<style>body{font-family:"Microsoft YaHei",sans-serif;background:#f5f7fb;color:#172033;margin:0}header{background:#173a70;color:white;padding:22px 30px}main{padding:20px;max-width:1500px;margin:auto}.card{background:white;border:1px solid #dce3ed;border-radius:14px;padding:18px;margin-bottom:16px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}input,select,button{padding:9px;border:1px solid #bcc7d6;border-radius:8px}button{background:#174a7e;color:white;cursor:pointer}button.danger{background:#a32121}table{width:100%;border-collapse:collapse;margin-top:12px}th,td{border:1px solid #dce3ed;padding:8px;text-align:left}.warn{background:#fff3cd;padding:12px;border-radius:8px}.ok{color:#087443;font-weight:bold}/* TLC_SYSTEM_ADMIN_LIST_INTERACTION_R1 */
.tlc-unified-list-tools{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin:8px 0}.tlc-unified-list-tools input,.tlc-unified-list-tools select{width:auto!important;min-width:150px;margin:0!important}.tlc-unified-list-tools .tlc-list-page-info{margin-left:auto;color:#667085;font-size:12px}
table[data-tlc-unified-list] tbody tr{cursor:pointer}table[data-tlc-unified-list] tbody tr:hover{background:#fff4cc}table[data-tlc-unified-list] tbody tr.tlc-list-active{background:#ffe08a!important}
table[data-tlc-unified-list] th[data-tlc-list-sort]{cursor:pointer;user-select:none;white-space:nowrap}table[data-tlc-unified-list] th[data-tlc-list-sort]::after{content:' ↕';color:#8290a3;font-size:11px}table[data-tlc-unified-list] th[data-tlc-list-sort][aria-sort='ascending']::after{content:' ↑';color:#1d4ed8}table[data-tlc-unified-list] th[data-tlc-list-sort][aria-sort='descending']::after{content:' ↓';color:#1d4ed8}
</style></head><body>
<header><h1>IP访问控制</h1><div>SECURITY IP CONTROL R1</div></header><main>
<div class="warn"><b>当前模式：<span id="mode">加载中</span></b>。本机 127.0.0.1／::1 永久保留紧急入口。</div>
<section class="card"><h2>阻断启用控制</h2><p>第一步开启5分钟测试。第二步必须在期限内再次确认；未确认会自动恢复监控模式。</p><div class="grid"><button onclick="startTest()">开启5分钟测试</button><button onclick="confirmTest()">确认正式阻断</button><button class="danger" onclick="cancelMode()">恢复监控模式</button></div><pre id="enforcement"></pre></section>
<section class="card"><h2>当前访问</h2><pre id="current">加载中...</pre></section>
<section class="card"><h2>IP／CIDR规则</h2><div class="grid"><input id="rName" placeholder="规则名称"><input id="rNetwork" placeholder="IP或CIDR，例如 192.168.1.0/24"><select id="rDecision"><option>ALLOW</option><option>DENY</option></select><select id="rScope"><option>GLOBAL</option><option>LOCAL</option><option>LEGAL_ENTITY</option><option>DEPARTMENT</option><option>USER</option></select><input id="rScopeId" placeholder="范围ID（按需）"><input id="rNote" placeholder="说明"><button onclick="saveRule()">保存规则</button></div><table><thead><tr><th>名称</th><th>网络</th><th>判断</th><th>范围</th><th>范围ID</th><th>启用</th><th></th></tr></thead><tbody id="rules"></tbody></table></section>
<section class="card"><h2>可信代理</h2><div class="grid"><input id="pName" placeholder="代理名称"><input id="pNetwork" placeholder="代理IP或CIDR"><input id="pNote" placeholder="说明"><button onclick="saveProxy()">保存可信代理</button></div><table><thead><tr><th>名称</th><th>网络</th><th>启用</th><th></th></tr></thead><tbody id="proxies"></tbody></table></section>
<section class="card"><h2>最近监控审计</h2><table><thead><tr><th>时间</th><th>用户</th><th>直接IP</th><th>有效IP</th><th>判断</th><th>路径</th></tr></thead><tbody id="audit"></tbody></table></section>
</main><script>
const $=id=>document.getElementById(id);async function api(url,opt){const r=await fetch(url,opt);const body=await r.json().catch(()=>({}));if(!r.ok)throw new Error(typeof body.detail==='string'?body.detail:JSON.stringify(body.detail||body));return body}const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let activeTestId='';async function load(){const d=await api('/api/security-ip-control/overview');$('mode').textContent=d.enforcement.mode;$('enforcement').textContent=JSON.stringify(d.enforcement,null,2);activeTestId=d.enforcement.test_id||'';$('current').textContent=JSON.stringify(d.current_access,null,2);$('rules').innerHTML=d.rules.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.network)}</td><td>${esc(x.decision)}</td><td>${esc(x.scope_type)}</td><td>${esc(x.scope_id)}</td><td>${x.enabled?'是':'否'}</td><td><button class="danger" onclick="delRule('${esc(x.id)}')">删除</button></td></tr>`).join('');$('proxies').innerHTML=d.trusted_proxies.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.network)}</td><td>${x.enabled?'是':'否'}</td><td><button class="danger" onclick="delProxy('${esc(x.id)}')">删除</button></td></tr>`).join('');$('audit').innerHTML=d.audit.map(x=>`<tr><td>${esc(x.created_at)}</td><td>${esc(x.user_id)}</td><td>${esc(x.direct_ip)}</td><td>${esc(x.effective_ip)}</td><td>${esc(x.decision)}</td><td>${esc(x.path)}</td></tr>`).join('')}
async function saveRule(){await api('/api/security-ip-control/rules',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:$('rName').value,network:$('rNetwork').value,decision:$('rDecision').value,scope_type:$('rScope').value,scope_id:$('rScopeId').value,note:$('rNote').value})});await load()}async function saveProxy(){await api('/api/security-ip-control/trusted-proxies',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:$('pName').value,network:$('pNetwork').value,note:$('pNote').value})});await load()}async function delRule(id){if(confirm('确认删除此规则？')){await api('/api/security-ip-control/rules/'+id,{method:'DELETE'});await load()}}async function delProxy(id){if(confirm('确认删除此可信代理？')){await api('/api/security-ip-control/trusted-proxies/'+id,{method:'DELETE'});await load()}}
async function startTest(){if(!confirm('确认开启5分钟真实阻断测试？请确保当前IP已有ALLOW规则。'))return;await api('/api/security-ip-control/enforcement/test',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({confirmation:'START 5 MINUTE TEST'})});await load()}async function confirmTest(){if(!activeTestId){alert('没有有效测试期');return}if(!confirm('确认永久启用IP阻断？'))return;await api('/api/security-ip-control/enforcement/confirm',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({test_id:activeTestId,confirmation:'CONFIRM PERMANENT ENFORCEMENT'})});await load()}async function cancelMode(){if(!confirm('确认恢复监控模式？'))return;await api('/api/security-ip-control/enforcement/cancel',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({confirmation:'RETURN TO MONITOR'})});await load()}load().catch(e=>alert(e.message));
</script><script>
/* TLC_SYSTEM_ADMIN_LIST_INTERACTION_R1 */
(function(){
 const PAGE_SIZE=100,states=new Map();let timer=0;
 function businessHeaders(table){return [...table.querySelectorAll("thead th")].filter(th=>!th.classList.contains("tlc-row-no")&&!th.classList.contains("tlc-row-check"))}
 function businessCells(row){return [...row.children].filter(td=>!td.classList.contains("tlc-row-no")&&!td.classList.contains("tlc-row-check"))}
 function init(table){
  if(states.has(table))return states.get(table);if(!table.querySelector("thead")||!table.querySelector("tbody"))return null;
  const state={page:1,sort:-1,dir:"asc",busy:false};states.set(table,state);table.dataset.tlcUnifiedList="1";
  const tools=document.createElement("div");tools.className="tlc-unified-list-tools";tools.innerHTML='<input class="tlc-list-all" placeholder="综合检索（全字段部分匹配）"><select class="tlc-list-field"></select><input class="tlc-list-value" placeholder="指定字段部分匹配"><button type="button" class="tlc-list-prev">上一页</button><button type="button" class="tlc-list-next">下一页</button><span class="tlc-list-page-info"></span>';
  table.parentElement.insertBefore(tools,table);const select=tools.querySelector(".tlc-list-field");businessHeaders(table).forEach((th,index)=>{const option=document.createElement("option");option.value=String(index);option.textContent=th.textContent.trim()||`列${index+1}`;select.appendChild(option);if(th.querySelector("input,button,select"))return;th.dataset.tlcListSort=String(index);th.addEventListener("click",()=>{state.dir=state.sort===index&&state.dir==="asc"?"desc":"asc";state.sort=index;state.page=1;businessHeaders(table).forEach(x=>x.removeAttribute("aria-sort"));th.setAttribute("aria-sort",state.dir==="asc"?"ascending":"descending");apply(table)})});
  tools.querySelector(".tlc-list-all").addEventListener("input",()=>{state.page=1;apply(table)});tools.querySelector(".tlc-list-value").addEventListener("input",()=>{state.page=1;apply(table)});select.addEventListener("change",()=>{state.page=1;apply(table)});tools.querySelector(".tlc-list-prev").addEventListener("click",()=>{state.page--;apply(table)});tools.querySelector(".tlc-list-next").addEventListener("click",()=>{state.page++;apply(table)});
  table.querySelector("tbody").addEventListener("click",event=>{if(event.target.closest("input,button,a,select,label,textarea"))return;const row=event.target.closest("tr");if(!row)return;table.querySelectorAll("tbody tr.tlc-list-active").forEach(x=>x.classList.remove("tlc-list-active"));row.classList.add("tlc-list-active")});return state;
 }
 function apply(table){
  const state=init(table);if(!state||state.busy)return;state.busy=true;const tools=table.previousElementSibling;if(!tools?.classList.contains("tlc-unified-list-tools")){state.busy=false;return}const all=tools.querySelector(".tlc-list-all").value.trim().toLocaleLowerCase(),field=Number(tools.querySelector(".tlc-list-field").value||0),value=tools.querySelector(".tlc-list-value").value.trim().toLocaleLowerCase();let rows=[...table.querySelectorAll("tbody tr")];rows.forEach(row=>row.dataset.tlcListMatch=(!all||row.textContent.toLocaleLowerCase().includes(all))&&(!value||String(businessCells(row)[field]?.textContent||"").toLocaleLowerCase().includes(value))?"1":"0");let matched=rows.filter(row=>row.dataset.tlcListMatch==="1");
  if(state.sort>=0){matched.sort((a,b)=>{const av=String(businessCells(a)[state.sort]?.textContent||"").trim(),bv=String(businessCells(b)[state.sort]?.textContent||"").trim(),an=Number(av.replace(/,/g,"")),bn=Number(bv.replace(/,/g,""));const result=Number.isFinite(an)&&Number.isFinite(bn)?an-bn:av.localeCompare(bv,undefined,{numeric:true});return state.dir==="asc"?result:-result});const current=rows.filter(row=>row.dataset.tlcListMatch==="1");if(matched.some((row,i)=>current[i]!==row))matched.forEach(row=>row.parentElement.appendChild(row))}
  const pages=Math.max(1,Math.ceil(matched.length/PAGE_SIZE));state.page=Math.max(1,Math.min(state.page,pages));const visible=new Set(matched.slice((state.page-1)*PAGE_SIZE,state.page*PAGE_SIZE));rows.forEach(row=>row.style.display=visible.has(row)?"":"none");tools.querySelector(".tlc-list-page-info").textContent=`${matched.length} 件｜第 ${state.page} / ${pages} 页`;tools.querySelector(".tlc-list-prev").disabled=state.page<=1;tools.querySelector(".tlc-list-next").disabled=state.page>=pages;state.busy=false;
 }
 function refresh(){document.querySelectorAll("table").forEach(table=>{init(table);apply(table)})}function schedule(){clearTimeout(timer);timer=setTimeout(refresh,35)}if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",refresh,{once:true});else refresh();new MutationObserver(schedule).observe(document.documentElement,{childList:true,subtree:true});
})();
</script></body></html>
