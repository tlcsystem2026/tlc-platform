<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>银行流水导入与查看</title>
<style>
body{font-family:Arial,"Microsoft YaHei",sans-serif;margin:0;background:#f6f7f9;color:#222}
header{background:#1f4e78;color:#fff;padding:18px 24px}
main{padding:20px}
.card{background:#fff;border:1px solid #ddd;border-radius:8px;padding:16px;margin-bottom:18px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input,select,button{padding:8px;border:1px solid #bbb;border-radius:4px}
button{cursor:pointer;background:#1f4e78;color:#fff}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{border:1px solid #ddd;padding:8px;text-align:left}
th{background:#eef3f8}
.credit{color:#0b6e3f;font-weight:bold}
.debit{color:#b00020;font-weight:bold}
.summary{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.metric{background:#eef3f8;border-radius:6px;padding:12px}
.small{font-size:12px;color:#666}
@media(max-width:900px){.summary{grid-template-columns:1fr 1fr}}

/* TLC_BANK_TRANSACTION_LIST_INTERACTION_R1 */
.tx-search-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px;margin:10px 0}
.tx-search-grid input{width:100%;box-sizing:border-box}
#txTable tbody tr{cursor:pointer}#txTable tbody tr:hover{background:#fff4cc}#txTable tbody tr.is-active{background:#ffe08a!important}
#txTable th[data-sort-key]{cursor:pointer;user-select:none;white-space:nowrap}
#txTable th[data-sort-key]::after{content:' ↕';color:#8290a3;font-size:12px}
#txTable th[data-sort-key][aria-sort='ascending']::after{content:' ↑';color:#1f4e78}
#txTable th[data-sort-key][aria-sort='descending']::after{content:' ↓';color:#1f4e78}
.tx-pager{display:flex;align-items:center;justify-content:flex-end;gap:8px;margin-top:10px}.tx-pager button:disabled{opacity:.45;cursor:not-allowed}
</style>
</head>
<body>
<header>
  <h1>银行流水导入与查看</h1>
  <div>巣鴨信用金庫 / ゆうちょう銀行</div>
</header>
<main>
<section class="card">
<h2>CSV 导入</h2>
<div class="toolbar">
  <select id="importBankCode" onchange="handleImportBankChange()"><option value="">请先选择银行</option><option value="SUGAMO_SHINKIN">SUGAMO_SHINKIN / 巣鴨信用金庫</option><option value="JAPAN_POST_BANK">JAPAN_POST_BANK / ゆうちょ銀行</option></select>
  <input id="bankFile" type="file" accept=".csv,text/csv" disabled>
  <button onclick="uploadCsv()">导入</button>
  <span id="uploadMessage" class="small"></span>
</div>
<div class="small" data-contract="TLC_BANK_IMPORT_SELECTED_BANK_VALIDATION_R1">必须先选择银行，再选择 CSV。导入前由服务器检测 CSV 格式；与所选银行不一致时整批拒绝，不写入流水。</div>
</section>

<section class="card">
<h2>流水检索</h2>
<div class="toolbar">
  <select id="bankCode">
    <option value="">全部银行</option>
    <option value="SUGAMO_SHINKIN">巣鴨信用金庫</option>
    <option value="JAPAN_POST_BANK">ゆうちょう銀行</option>
  </select>
  <select id="direction">
    <option value="">全部方向</option>
    <option value="CREDIT">入金</option>
    <option value="DEBIT">出金</option>
  </select>
  <input id="dateFrom" type="date">
  <input id="dateTo" type="date">
  <input id="counterparty" placeholder="对方名称">
  <button onclick="loadAll()">检索</button>
</div>
</section>

<section class="card">
<div class="summary">
  <div class="metric">件数<br><strong id="txCount">0</strong></div>
  <div class="metric">入金件数<br><strong id="creditCount">0</strong></div>
  <div class="metric">入金合计<br><strong id="creditTotal">0</strong></div>
  <div class="metric">出金件数<br><strong id="debitCount">0</strong></div>
  <div class="metric">出金合计<br><strong id="debitTotal">0</strong></div>
</div>
</section>

<section class="card">
<h2>银行流水一览</h2>
<div id="listMessage" class="small"></div>
<div style="overflow:auto">
<div class="tx-search-grid" data-contract="TLC_BANK_TRANSACTION_LIST_INTERACTION_R1">
  <input id="txKeyword" placeholder="综合检索：银行、对方、摘要、流水ID" oninput="applyTxView(true)">
  <input id="txAccountSearch" placeholder="口座号码（部分匹配）" oninput="applyTxView(true)">
  <input id="txDescriptionSearch" placeholder="摘要（部分匹配）" oninput="applyTxView(true)">
  <input id="txAmountSearch" placeholder="金额（部分匹配）" oninput="applyTxView(true)">
</div>
<table id="txTable">
<thead>
<tr>
<th data-sort-key="bank_name">银行</th><th data-sort-key="transaction_date">日期</th><th data-sort-key="direction">方向</th><th data-sort-key="amount" data-sort-type="number">金额</th><th data-sort-key="counterparty">对方</th><th data-sort-key="description">摘要</th><th data-sort-key="balance" data-sort-type="number">余额</th><th data-sort-key="transaction_id">流水ID</th>
</tr>
</thead>
<tbody id="txBody"></tbody>
</table>
</div>
<div class="tx-pager"><button id="txPrev" type="button" onclick="changeTxPage(-1)">上一页</button><span id="txPageInfo"></span><button id="txNext" type="button" onclick="changeTxPage(1)">下一页</button></div>
</section>
</main>

<script>
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
async function api(url,options){
  const r=await fetch(url,options);
  const b=await r.json();
  if(!r.ok) throw new Error(b.detail||JSON.stringify(b));
  return b;
}
function handleImportBankChange(){
  const bank=document.getElementById("importBankCode").value;
  const file=document.getElementById("bankFile");file.disabled=!bank;if(!bank)file.value="";
  document.getElementById("uploadMessage").textContent=bank?`已选择：${bank}`:"请先选择银行";
}
function params(){
  const p=new URLSearchParams();
  const bank=document.getElementById("bankCode").value;
  const direction=document.getElementById("direction").value;
  const from=document.getElementById("dateFrom").value;
  const to=document.getElementById("dateTo").value;
  const cp=document.getElementById("counterparty").value.trim();
  if(bank)p.set("bank_code",bank);
  if(direction)p.set("direction",direction);
  if(from)p.set("transaction_date_from",from);
  if(to)p.set("transaction_date_to",to);
  if(cp)p.set("counterparty",cp);
  p.set("limit","0");
  return p;
}
async function uploadCsv(){
  const selectedBank=document.getElementById("importBankCode").value;
  if(!selectedBank){alert("请先选择银行");return}
  const file=document.getElementById("bankFile").files[0];
  if(!file){alert("请选择CSV文件");return}
  const buf=await file.arrayBuffer();
  try{
    const query=new URLSearchParams({source_name:file.name,selected_bank_code:selectedBank});
    const result=await api("/api/bank-import/csv?"+query.toString(),{
      method:"POST",
      headers:{"Content-Type":"text/csv"},
      body:buf
    });
    document.getElementById("uploadMessage").textContent=
      `${result.bank_code}: parsed=${result.parsed}, created=${result.created}, existing=${result.existing}`;
    await loadAll();
  }catch(e){alert(e.message)}
}
let txSourceRows=[];
let txPage=1;
const TX_PAGE_SIZE=100;
let txSortKey="transaction_date";
let txSortDirection="desc";
function txText(v){return String(v??"").toLocaleLowerCase()}
function txNumber(v){const n=Number(String(v??"").replace(/,/g,""));return Number.isFinite(n)?n:0}
function applyTxView(resetPage=false){
  if(resetPage)txPage=1;
  const keyword=txText(document.getElementById("txKeyword")?.value.trim());
  const account=txText(document.getElementById("txAccountSearch")?.value.trim());
  const description=txText(document.getElementById("txDescriptionSearch")?.value.trim());
  const amount=txText(document.getElementById("txAmountSearch")?.value.trim());
  let rows=txSourceRows.filter(row=>{
    const all=[row.bank_code,row.bank_name,row.account_number,row.transaction_date,row.direction,row.amount,row.counterparty,row.description,row.balance,row.transaction_id].map(txText).join(" ");
    return (!keyword||all.includes(keyword))&&(!account||txText(row.account_number).includes(account))&&(!description||txText(row.description).includes(description))&&(!amount||txText(row.amount).includes(amount));
  });
  rows.sort((a,b)=>{const numeric=document.querySelector(`#txTable th[data-sort-key="${txSortKey}"]`)?.dataset.sortType==="number";const av=numeric?txNumber(a[txSortKey]):txText(a[txSortKey]);const bv=numeric?txNumber(b[txSortKey]):txText(b[txSortKey]);const result=av<bv?-1:av>bv?1:0;return txSortDirection==="asc"?result:-result});
  const pages=Math.max(1,Math.ceil(rows.length/TX_PAGE_SIZE));txPage=Math.min(txPage,pages);
  const visible=rows.slice((txPage-1)*TX_PAGE_SIZE,txPage*TX_PAGE_SIZE);
  const body=document.getElementById("txBody");body.innerHTML="";
  visible.forEach(row=>{const tr=document.createElement("tr");tr.innerHTML=`<td>${esc(row.bank_name)}</td><td>${esc(row.transaction_date)}</td><td class="${row.direction==='CREDIT'?'credit':'debit'}">${esc(row.direction)}</td><td>${esc(row.amount)}</td><td>${esc(row.counterparty)}</td><td>${esc(row.description)}</td><td>${esc(row.balance)}</td><td>${esc(row.transaction_id)}</td>`;tr.addEventListener("click",event=>{if(event.target.closest("input,button,a,select"))return;body.querySelectorAll("tr.is-active").forEach(x=>x.classList.remove("is-active"));tr.classList.add("is-active")});body.appendChild(tr)});
  document.getElementById("listMessage").textContent=`检索结果：${rows.length} 件（全体 ${txSourceRows.length} 件）`;
  document.getElementById("txPageInfo").textContent=`第 ${txPage} / ${pages} 页`;
  document.getElementById("txPrev").disabled=txPage<=1;document.getElementById("txNext").disabled=txPage>=pages;
}
function changeTxPage(delta){txPage+=delta;applyTxView(false);document.getElementById("txTable").scrollIntoView({block:"start"})}
document.querySelectorAll("#txTable th[data-sort-key]").forEach(th=>th.addEventListener("click",()=>{const key=th.dataset.sortKey;if(txSortKey===key)txSortDirection=txSortDirection==="asc"?"desc":"asc";else{txSortKey=key;txSortDirection="asc"}document.querySelectorAll("#txTable th[data-sort-key]").forEach(x=>x.removeAttribute("aria-sort"));th.setAttribute("aria-sort",txSortDirection==="asc"?"ascending":"descending");applyTxView(true)}));
async function loadAll(){
  const p=params();
  const summaryParams=new URLSearchParams();
  for(const k of ["bank_code","transaction_date_from","transaction_date_to"]){if(p.has(k))summaryParams.set(k,p.get(k));}
  const [rows,summary]=await Promise.all([api("/api/bank-import/transactions?"+p.toString()),api("/api/bank-import/summary?"+summaryParams.toString())]);
  document.getElementById("txCount").textContent=summary.transaction_count;document.getElementById("creditCount").textContent=summary.credit_count;document.getElementById("creditTotal").textContent=summary.credit_total;document.getElementById("debitCount").textContent=summary.debit_count;document.getElementById("debitTotal").textContent=summary.debit_total;
  txSourceRows=Array.isArray(rows)?rows:[];applyTxView(true);
}
loadAll().catch(e=>document.getElementById("listMessage").textContent=e.message);
</script>
<script>
/* TLC_TABLE_ROW_SELECTOR_V1 */
(function(){
  const NUMBER_CLASS="tlc-row-no";
  const CHECK_CLASS="tlc-row-check";
  let scheduled=false;

  function headerRows(table){
    const explicit=[...table.querySelectorAll("thead tr")];
    if(explicit.length) return explicit;
    const first=[...table.querySelectorAll("tr")].find(row=>row.querySelector("th"));
    return first?[first]:[];
  }

  function dataRows(table,headers){
    const headerSet=new Set(headers);
    return [...table.querySelectorAll("tr")].filter(row=>{
      if(headerSet.has(row)) return false;
      if(row.querySelector("th") && !row.querySelector("td")) return false;
      return true;
    });
  }

  function addHeader(row){
    if(row.querySelector("."+NUMBER_CLASS)) return;

    const checkTh=document.createElement("th");
    checkTh.className=CHECK_CLASS;
    checkTh.style.width="38px";
    checkTh.style.textAlign="center";

    const all=document.createElement("input");
    all.type="checkbox";
    all.title="全选/取消全选";
    all.addEventListener("click",event=>event.stopPropagation());
    all.addEventListener("change",()=>{
      const table=row.closest("table");
      table.querySelectorAll("input.tlc-row-select").forEach(input=>{
        input.checked=all.checked;
      });
    });
    checkTh.appendChild(all);

    const noTh=document.createElement("th");
    noTh.className=NUMBER_CLASS;
    noTh.textContent="No";
    noTh.style.width="52px";
    noTh.style.textAlign="center";

    row.insertBefore(checkTh,row.firstChild);
    row.insertBefore(noTh,row.firstChild);
  }

  function addData(row,index){
    let no=row.querySelector(":scope > td."+NUMBER_CLASS);
    let check=row.querySelector(":scope > td."+CHECK_CLASS);

    if(!check){
      check=document.createElement("td");
      check.className=CHECK_CLASS;
      check.style.textAlign="center";
      const input=document.createElement("input");
      input.type="checkbox";
      input.className="tlc-row-select";
      input.addEventListener("click",event=>event.stopPropagation());
      check.appendChild(input);
      row.insertBefore(check,row.firstChild);
    }

    if(!no){
      no=document.createElement("td");
      no.className=NUMBER_CLASS;
      no.style.textAlign="center";
      row.insertBefore(no,row.firstChild);
    }

    no.textContent=String(index);
  }

  function enhance(table){
    const headers=headerRows(table);
    headers.forEach(addHeader);
    dataRows(table,headers).forEach((row,index)=>addData(row,index+1));
  }

  function run(){
    scheduled=false;
    document.querySelectorAll("table").forEach(enhance);
  }

  function schedule(){
    if(scheduled) return;
    scheduled=true;
    setTimeout(run,0);
  }

  if(document.readyState==="loading"){
    document.addEventListener("DOMContentLoaded",run,{once:true});
  }else{
    run();
  }

  new MutationObserver(schedule).observe(document.documentElement,{
    childList:true,
    subtree:true
  });
})();
</script>
</body>
</html>
