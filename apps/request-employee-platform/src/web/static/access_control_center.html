<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>人员与权限管理</title><style>body{font-family:Arial,"Microsoft YaHei";margin:0;background:#f5f7fa;color:#172033}header{background:#173b63;color:#fff;padding:20px}main{padding:16px;max-width:1600px;margin:auto}.card{background:#fff;border:1px solid #d8e0e8;border-radius:10px;padding:15px;margin-bottom:14px}.grid{display:grid;grid-template-columns:repeat(4,minmax(170px,1fr));gap:9px}label{display:flex;flex-direction:column;gap:4px}input,select,button{padding:8px;border:1px solid #b7c1cc;border-radius:5px}button{cursor:pointer}.primary{background:#174f83;color:#fff}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.scroll{overflow:auto;max-height:420px}table{border-collapse:collapse;width:100%}th,td{border:1px solid #d8e0e8;padding:7px;white-space:nowrap}th{background:#eaf2fb;position:sticky;top:0}.tabs button{background:#e8eef5}.tabs button.active{background:#174f83;color:#fff}.hidden{display:none}.small{font-size:12px;color:#667085}/* TLC_ACCESS_CONTROL_LIST_INTERACTION_R1 */
.acl-list-tools{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin:8px 0}.acl-list-tools input,.acl-list-tools select{min-width:150px}.acl-list-tools .acl-page-info{margin-left:auto;color:#667085;font-size:12px}
table[data-acl-list] tbody tr{cursor:pointer}table[data-acl-list] tbody tr:hover{background:#fff4cc}table[data-acl-list] tbody tr.acl-active{background:#ffe08a!important}
table[data-acl-list] th[data-acl-sort]{cursor:pointer;user-select:none}table[data-acl-list] th[data-acl-sort]::after{content:' ↕';color:#8290a3;font-size:11px}table[data-acl-list] th[data-acl-sort][aria-sort='ascending']::after{content:' ↑';color:#174f83}table[data-acl-list] th[data-acl-sort][aria-sort='descending']::after{content:' ↓';color:#174f83}
</style></head><body><header><h1>人员、部门、角色与权限管理</h1><div>Access Control R1：本版维护权限数据，暂不阻断现有业务页面</div></header><main>
<section class="card"><div class="toolbar tabs"><button onclick="tab('users',this)" class="active">人员</button><button onclick="tab('departments',this)">部门</button><button onclick="tab('permissions',this)">角色权限矩阵</button><button onclick="tab('audit',this)">权限审计</button><a href="/system-parameter-center">系统参数</a><a href="/dashboard">Dashboard</a></div><label>操作人<input id="actor" value="super-admin"></label><div id="message" class="small"></div></section>
<section id="users" class="card pane"><h2>人员维护</h2><div class="grid"><label>员工编号<input id="employeeNo"></label><label>登录ID<input id="loginId"></label><label>英文姓名<input id="nameEn"></label><label>日文姓名<input id="nameJa"></label><label>中文姓名<input id="nameZh"></label><label>邮箱<input id="email"></label><label>手机<input id="mobile"></label><label>法人代码<input id="userLegal"></label><label>部门<select id="userDepartment"></select></label><label>状态<select id="userActive"><option value="true">启用</option><option value="false">停用</option></select></label><label>有效开始<input id="validFrom" type="date"></label><label>有效结束<input id="validTo" type="date"></label></div><div class="toolbar"><button class="primary" onclick="saveUser()">保存人员</button><button onclick="clearUser()">新增／清空</button></div><div class="scroll"><table><thead><tr><th>No</th><th>员工编号</th><th>登录ID</th><th>中文名</th><th>日文名</th><th>英文名</th><th>法人</th><th>部门</th><th>状态</th><th>角色</th></tr></thead><tbody id="userRows"></tbody></table></div><h3>所选人员角色</h3><div id="roleChecks"></div><button onclick="saveUserRoles()">保存角色分配</button></section>
<section id="departments" class="card pane hidden"><h2>部门维护</h2><div class="grid"><label>部门代码<input id="departmentCode"></label><label>中文名称<input id="departmentZh"></label><label>日文名称<input id="departmentJa"></label><label>英文名称<input id="departmentEn"></label><label>法人代码<input id="departmentLegal"></label><label>状态<select id="departmentActive"><option value="true">启用</option><option value="false">停用</option></select></label></div><div class="toolbar"><button class="primary" onclick="saveDepartment()">保存部门</button></div><div class="scroll"><table><thead><tr><th>No</th><th>代码</th><th>中文</th><th>日文</th><th>英文</th><th>法人</th><th>状态</th></tr></thead><tbody id="departmentRows"></tbody></table></div></section>
<section id="permissions" class="card pane hidden"><h2>角色权限矩阵</h2><div class="toolbar"><label>角色<select id="permissionRole" onchange="renderPermissionMatrix()"></select></label><label>数据范围<select id="bulkScope"><option>SELF</option><option>DEPARTMENT</option><option selected>LEGAL_ENTITY</option><option>ALL</option></select></label><button onclick="checkAllPermissions(true)">全选</button><button onclick="checkAllPermissions(false)">全清</button><button class="primary" onclick="savePermissionMatrix()">保存权限矩阵</button></div><div class="scroll"><table><thead><tr><th>模块</th><th>名称</th><th>VIEW</th><th>EDIT</th><th>DELETE</th><th>EXECUTE</th><th>APPROVE</th><th>EXPORT</th><th>MAINTAIN</th></tr></thead><tbody id="permissionRows"></tbody></table></div></section>
<section id="audit" class="card pane hidden"><h2>权限变更审计</h2><div class="scroll"><table><thead><tr><th>时间</th><th>操作人</th><th>对象</th><th>对象ID</th><th>操作</th><th>说明</th></tr></thead><tbody id="auditRows"></tbody></table></div></section>
</main><script>let state={},selectedUser="";const $=x=>document.getElementById(x),esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));async function api(u,o={}){const r=await fetch(u,o),t=await r.text();let b;try{b=JSON.parse(t)}catch{b=t}if(!r.ok)throw Error((b.detail&&b.detail.message)||b.detail||b);return b}function tab(id,b){document.querySelectorAll('.pane').forEach(x=>x.classList.add('hidden'));$(id).classList.remove('hidden');document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));b.classList.add('active')}async function load(){state=await api('/api/access-control/overview');render();const a=await api('/api/access-control/audit');$('auditRows').innerHTML=a.map(x=>`<tr><td>${esc(x.created_at)}</td><td>${esc(x.actor)}</td><td>${esc(x.target_type)}</td><td>${esc(x.target_id)}</td><td>${esc(x.action)}</td><td>${esc(x.detail)}</td></tr>`).join('')}function render(){let ur={};state.user_roles.forEach(x=>(ur[x.user_id]??=[]).push(x.role_code));$('userRows').innerHTML=state.users.map((x,i)=>`<tr onclick="selectUser('${x.id}')"><td>${i+1}</td><td>${esc(x.employee_no)}</td><td>${esc(x.login_id)}</td><td>${esc(x.name_zh)}</td><td>${esc(x.name_ja)}</td><td>${esc(x.name_en)}</td><td>${esc(x.legal_entity_id)}</td><td>${esc(x.department_id)}</td><td>${x.active?'启用':'停用'}</td><td>${esc((ur[x.id]||[]).join(','))}</td></tr>`).join('');$('departmentRows').innerHTML=state.departments.map((x,i)=>`<tr><td>${i+1}</td><td>${esc(x.department_code)}</td><td>${esc(x.name_zh)}</td><td>${esc(x.name_ja)}</td><td>${esc(x.name_en)}</td><td>${esc(x.legal_entity_id)}</td><td>${x.active?'启用':'停用'}</td></tr>`).join('');$('userDepartment').innerHTML='<option value=""></option>'+state.departments.map(x=>`<option value="${esc(x.id)}">${esc(x.department_code)} ${esc(x.name_zh)}</option>`).join('');$('permissionRole').innerHTML=state.roles.map(x=>`<option>${esc(x.role_code)}</option>`).join('');$('roleChecks').innerHTML=state.roles.map(x=>`<label style="display:inline-block;margin:5px"><input type="checkbox" class="role-check" value="${esc(x.role_code)}"> ${esc(x.name_zh)}</label>`).join('');renderPermissionMatrix()}function selectUser(id){selectedUser=id;const x=state.users.find(y=>y.id===id);let m={employeeNo:'employee_no',loginId:'login_id',nameEn:'name_en',nameJa:'name_ja',nameZh:'name_zh',email:'email',mobile:'mobile',userLegal:'legal_entity_id',userDepartment:'department_id',validFrom:'valid_from',validTo:'valid_to'};Object.entries(m).forEach(([a,b])=>$(a).value=x[b]||'');$('userActive').value=String(!!x.active);let roles=new Set(state.user_roles.filter(r=>r.user_id===id).map(r=>r.role_code));document.querySelectorAll('.role-check').forEach(c=>c.checked=roles.has(c.value))}function clearUser(){selectedUser='';['employeeNo','loginId','nameEn','nameJa','nameZh','email','mobile','userLegal','validFrom','validTo'].forEach(x=>$(x).value='');$('userDepartment').value='';$('userActive').value='true'}async function saveUser(){let p={employee_no:$('employeeNo').value,login_id:$('loginId').value,name_en:$('nameEn').value,name_ja:$('nameJa').value,name_zh:$('nameZh').value,email:$('email').value,mobile:$('mobile').value,legal_entity_id:$('userLegal').value,department_id:$('userDepartment').value,active:$('userActive').value==='true',valid_from:$('validFrom').value,valid_to:$('validTo').value,actor:$('actor').value};await api('/api/access-control/users',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(p)});await load()}async function saveDepartment(){let p={department_code:$('departmentCode').value,name_zh:$('departmentZh').value,name_ja:$('departmentJa').value,name_en:$('departmentEn').value,legal_entity_id:$('departmentLegal').value,active:$('departmentActive').value==='true',actor:$('actor').value};await api('/api/access-control/departments',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(p)});await load()}async function saveUserRoles(){if(!selectedUser)return alert('请先选择人员');let role_codes=[...document.querySelectorAll('.role-check:checked')].map(x=>x.value);await api(`/api/access-control/users/${selectedUser}/roles`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({role_codes,actor:$('actor').value})});await load()}function renderPermissionMatrix(){let role=$('permissionRole').value,has=new Set(state.permissions.filter(x=>x.role_code===role&&x.allowed).map(x=>x.module_code+'|'+x.action_code));$('permissionRows').innerHTML=state.modules.map(m=>`<tr><td>${esc(m.module_code)}</td><td>${esc(m.name_zh)}</td>${state.actions.map(a=>`<td><input type="checkbox" class="perm" data-module="${esc(m.module_code)}" data-action="${a}" ${has.has(m.module_code+'|'+a)?'checked':''}></td>`).join('')}</tr>`).join('')}function checkAllPermissions(v){document.querySelectorAll('.perm').forEach(x=>x.checked=v)}async function savePermissionMatrix(){let items=[...document.querySelectorAll('.perm:checked')].map(x=>({module_code:x.dataset.module,action_code:x.dataset.action,data_scope:$('bulkScope').value}));await api('/api/access-control/roles/'+encodeURIComponent($('permissionRole').value)+'/permissions',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({items,actor:$('actor').value})});await load()}load().catch(e=>alert(e.message));</script><script>
/* TLC_ACCESS_CONTROL_LIST_INTERACTION_R1 */
(function(){
 const PAGE_SIZE=100,bodyIds=["userRows","departmentRows","permissionRows","auditRows"],states=new Map();let timer=0;
 function cells(row){return [...row.children]}
 function init(table){
  if(states.has(table))return states.get(table);const state={page:1,sort:-1,dir:"asc",busy:false};states.set(table,state);table.dataset.aclList="1";
  const tools=document.createElement("div");tools.className="acl-list-tools";tools.innerHTML='<input class="acl-all" placeholder="综合检索（全字段部分匹配）"><select class="acl-field"></select><input class="acl-value" placeholder="指定字段部分匹配"><button type="button" class="acl-prev">上一页</button><button type="button" class="acl-next">下一页</button><span class="acl-page-info"></span>';
  table.parentElement.insertBefore(tools,table);const headers=[...table.querySelectorAll("thead th")],select=tools.querySelector(".acl-field");headers.forEach((th,index)=>{const o=document.createElement("option");o.value=String(index);o.textContent=th.textContent.trim();select.appendChild(o);if(th.querySelector("input"))return;th.dataset.aclSort=String(index);th.addEventListener("click",()=>{state.dir=state.sort===index&&state.dir==="asc"?"desc":"asc";state.sort=index;state.page=1;headers.forEach(x=>x.removeAttribute("aria-sort"));th.setAttribute("aria-sort",state.dir==="asc"?"ascending":"descending");apply(table)})});
  tools.querySelector(".acl-all").addEventListener("input",()=>{state.page=1;apply(table)});tools.querySelector(".acl-value").addEventListener("input",()=>{state.page=1;apply(table)});select.addEventListener("change",()=>{state.page=1;apply(table)});tools.querySelector(".acl-prev").addEventListener("click",()=>{state.page--;apply(table)});tools.querySelector(".acl-next").addEventListener("click",()=>{state.page++;apply(table)});
  table.querySelector("tbody").addEventListener("click",event=>{if(event.target.closest("input,button,a,select,label"))return;const row=event.target.closest("tr");if(!row)return;table.querySelectorAll("tbody tr.acl-active").forEach(x=>x.classList.remove("acl-active"));row.classList.add("acl-active")});return state;
 }
 function apply(table){
  const state=init(table);if(state.busy)return;state.busy=true;const tools=table.previousElementSibling,all=tools.querySelector(".acl-all").value.trim().toLocaleLowerCase(),field=Number(tools.querySelector(".acl-field").value||0),value=tools.querySelector(".acl-value").value.trim().toLocaleLowerCase();let rows=[...table.querySelectorAll("tbody tr")];rows.forEach(row=>row.dataset.aclMatch=(!all||row.textContent.toLocaleLowerCase().includes(all))&&(!value||String(cells(row)[field]?.textContent||"").toLocaleLowerCase().includes(value))?"1":"0");let matched=rows.filter(row=>row.dataset.aclMatch==="1");
  if(state.sort>=0){matched.sort((a,b)=>{const av=String(cells(a)[state.sort]?.textContent||"").trim(),bv=String(cells(b)[state.sort]?.textContent||"").trim(),an=Number(av.replace(/,/g,"")),bn=Number(bv.replace(/,/g,""));const result=Number.isFinite(an)&&Number.isFinite(bn)?an-bn:av.localeCompare(bv,undefined,{numeric:true});return state.dir==="asc"?result:-result});const current=rows.filter(row=>row.dataset.aclMatch==="1");if(matched.some((row,i)=>current[i]!==row))matched.forEach(row=>row.parentElement.appendChild(row))}
  const pages=Math.max(1,Math.ceil(matched.length/PAGE_SIZE));state.page=Math.max(1,Math.min(state.page,pages));const visible=new Set(matched.slice((state.page-1)*PAGE_SIZE,state.page*PAGE_SIZE));rows.forEach(row=>row.style.display=visible.has(row)?"":"none");tools.querySelector(".acl-page-info").textContent=`${matched.length} 件｜第 ${state.page} / ${pages} 页`;tools.querySelector(".acl-prev").disabled=state.page<=1;tools.querySelector(".acl-next").disabled=state.page>=pages;state.busy=false;
 }
 function refresh(){bodyIds.forEach(id=>{const body=document.getElementById(id);if(body){const table=body.closest("table");init(table);apply(table)}})}function schedule(){clearTimeout(timer);timer=setTimeout(refresh,30)}
 if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",refresh,{once:true});else refresh();new MutationObserver(schedule).observe(document.documentElement,{childList:true,subtree:true});
})();
</script></body></html>
