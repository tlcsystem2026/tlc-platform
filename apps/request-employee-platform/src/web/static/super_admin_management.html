<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>超级管理员设置</title><style>
body{margin:0;background:#f5f7fb;color:#182230;font-family:"Microsoft YaHei","Segoe UI",sans-serif}header{padding:24px 32px;background:#7f1d1d;color:#fff}main{padding:20px;max-width:1300px;margin:auto}.card{background:#fff;border:1px solid #d9e0ea;border-radius:14px;padding:18px;margin-bottom:16px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}label{display:block;font-size:14px;margin:8px 0}input,select,textarea{width:100%;box-sizing:border-box;padding:9px;border:1px solid #bdc7d6;border-radius:7px}button,a.button{display:inline-block;padding:10px 14px;border:0;border-radius:7px;background:#1d4ed8;color:white;text-decoration:none;cursor:pointer}.danger{background:#b91c1c}.muted{color:#64748b;font-size:13px}table{width:100%;border-collapse:collapse}th,td{padding:9px;border:1px solid #d9e0ea;text-align:left}th{background:#eef2f7}.notice{padding:12px;border-radius:8px;background:#fff7ed;border:1px solid #fdba74}.ok{color:#166534}.error{color:#b91c1c}</style></head><body>
<header><h1>超级管理员设置</h1><div>仅内部 IP 可访问｜超级管理员固定拥有全部模块、全部动作、ALL 数据范围</div></header><main>
<section class="card notice">此页面只管理超级管理员身份。普通人员与角色设置页面不会显示“超级管理员”，权限矩阵也不能减少超级管理员权限。系统始终至少保留一名有效超级管理员。</section>
<section class="card grid"><label>当前操作人（超级管理员）<select id="actor"></select></label><label>设置理由<textarea id="reason" rows="2" placeholder="必须填写"></textarea></label><div><div class="muted">允许网段</div><div id="cidrs"></div><div class="muted" id="rule"></div></div></section>
<section class="card"><h2>当前超级管理员</h2><div class="muted">撤销时输入确认文字 REVOKE_SUPER_ADMIN。最后一名不能撤销。</div><table><thead><tr><th>员工编号</th><th>中文姓名</th><th>日文姓名</th><th>英文姓名</th><th>登录 ID</th><th>操作</th></tr></thead><tbody id="admins"></tbody></table></section>
<section class="card"><h2>设置新的超级管理员</h2><div class="grid"><label>人员<select id="candidate"></select></label><label>确认文字<input id="grantConfirm" placeholder="GRANT_SUPER_ADMIN"></label><div><button onclick="grantAdmin()">设置为超级管理员</button></div></div></section>
<section class="card"><a class="button" href="/access-control-center">人员与权限</a> <a class="button" href="/dashboard">Dashboard</a><div id="message"></div></section>
</main><script>
let state={};const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(url,options={}){const r=await fetch(url,options),t=await r.text();let b;try{b=JSON.parse(t)}catch{b=t}if(!r.ok)throw Error(b.detail||b);return b}
async function load(){state=await api('/api/super-admin/overview');$('cidrs').textContent=state.internal_cidrs;$('rule').textContent=state.permission_rule;$('actor').innerHTML=state.super_admins.map(x=>`<option value="${esc(x.id)}">${esc(x.employee_no)} ${esc(x.name_zh||x.name_ja||x.name_en)}</option>`).join('');if(!state.super_admins.length)$('actor').innerHTML='<option value="">首次设置（BOOTSTRAP）</option>';$('candidate').innerHTML=state.candidates.map(x=>`<option value="${esc(x.id)}">${esc(x.employee_no)} ${esc(x.name_zh||x.name_ja||x.name_en)}</option>`).join('');$('admins').innerHTML=state.super_admins.map(x=>`<tr><td>${esc(x.employee_no)}</td><td>${esc(x.name_zh)}</td><td>${esc(x.name_ja)}</td><td>${esc(x.name_en)}</td><td>${esc(x.login_id)}</td><td><button class="danger" onclick="revokeAdmin('${esc(x.id)}')">撤销</button></td></tr>`).join('')}
async function grantAdmin(){try{await api('/api/super-admin/grant',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({target_user_id:$('candidate').value,actor_user_id:$('actor').value,reason:$('reason').value,confirmation:$('grantConfirm').value})});$('message').textContent='设置完成';$('message').className='ok';await load()}catch(e){$('message').textContent=e.message;$('message').className='error'}}
async function revokeAdmin(id){const confirmation=prompt('请输入 REVOKE_SUPER_ADMIN 确认撤销');if(confirmation===null)return;try{await api('/api/super-admin/revoke',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({target_user_id:id,actor_user_id:$('actor').value,reason:$('reason').value,confirmation})});$('message').textContent='撤销完成';$('message').className='ok';await load()}catch(e){$('message').textContent=e.message;$('message').className='error'}}
load().catch(e=>{$('message').textContent=e.message;$('message').className='error'});
</script></body></html>
