<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>数据库维护中心</title>
<style>
:root{--blue:#1d4ed8;--red:#b91c1c;--ink:#172033;--muted:#667085;--line:#dbe2ea;--bg:#f5f7fb}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Microsoft YaHei","Segoe UI",sans-serif}
header{padding:24px 32px;background:linear-gradient(90deg,#172554,#1d4ed8);color:#fff}header h1{margin:0 0 6px}
main{max-width:1500px;margin:auto;padding:22px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:18px;box-shadow:0 7px 20px #10204010}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}label{display:block;font-size:13px;color:var(--muted)}
input,select,textarea{width:100%;margin-top:5px;padding:10px;border:1px solid #cbd5e1;border-radius:8px;font:inherit}textarea{min-height:72px}
button{padding:10px 15px;border:0;border-radius:8px;background:var(--blue);color:#fff;font-weight:700;cursor:pointer;margin:4px}.secondary{background:#475467}.danger{background:var(--red)}
.toolbar{display:flex;gap:8px;align-items:end;flex-wrap:wrap}.toolbar label{min-width:210px;flex:1}.notice{padding:12px;border-radius:9px;background:#fff7ed;color:#9a3412;margin:10px 0}
.result{white-space:pre-wrap;background:#101828;color:#d1fadf;border-radius:10px;padding:12px;max-height:260px;overflow:auto}
.table-wrap{overflow:auto;max-height:520px;border:1px solid var(--line)}table{border-collapse:collapse;width:100%;font-size:13px;background:#fff}th,td{border-bottom:1px solid var(--line);padding:9px;text-align:left;white-space:nowrap}th{position:sticky;top:0;background:#eaf1fb;z-index:1}
.tag{display:inline-block;padding:2px 8px;border-radius:999px;background:#eaf1ff;color:#1d4ed8}.danger-zone{border:2px solid #fecaca}
/* TLC_DATABASE_MAINTENANCE_LIST_INTERACTION_R1 */
.db-list-tools{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin:8px 0}.db-list-tools input,.db-list-tools select{width:auto;min-width:165px;margin:0}.db-list-tools .db-page-info{margin-left:auto;color:var(--muted);font-size:12px}
table[data-db-list] tbody tr{cursor:pointer}table[data-db-list] tbody tr:hover{background:#fff4cc}table[data-db-list] tbody tr.db-active{background:#ffe08a!important}
table[data-db-list] th[data-db-sort]{cursor:pointer;user-select:none}table[data-db-list] th[data-db-sort]::after{content:' ↕';color:#8290a3;font-size:11px}table[data-db-list] th[data-db-sort][aria-sort='ascending']::after{content:' ↑';color:var(--blue)}table[data-db-list] th[data-db-sort][aria-sort='descending']::after{content:' ↓';color:var(--blue)}
</style>
</head>
<body>
<header><h1>数据库维护中心</h1><div>整库与单表备份／恢复・超级管理员数据清理・维护审计</div></header>
<main>
<section class="card">
  <h2>超级管理员确认</h2>
  <div class="grid">
    <label>操作人<input id="operator" value="super-admin"></label>
    <label>角色<input id="role" value="SUPER_ADMIN" readonly></label>
    <label>维护理由<textarea id="reason" placeholder="必须填写本次维护原因"></textarea></label>
  </div>
  <div class="notice">恢复和清空属于高风险操作。系统会先自动备份，但仍须输入页面提示的确认文字。</div>
  <button class="secondary" onclick="loadOverview()">刷新全部状态</button>
  <a href="/dashboard">返回 Dashboard</a>
</section>

<section class="card">
  <h2>1. 整体备份与恢复</h2>
  <button onclick="fullBackup()">立即创建整库备份</button>
  <div class="toolbar">
    <label>选择整库备份<select id="fullBackupSelect"></select></label>
    <label>恢复确认文字<input id="fullConfirmation" placeholder="RESTORE DATABASE"></label>
    <button class="danger" onclick="fullRestore()">恢复整个数据库</button>
  </div>
</section>

<section class="card">
  <h2>2. 单表备份与恢复</h2>
  <div class="toolbar">
    <label>选择数据表<select id="tableSelect" onchange="syncTableControls()"></select></label>
    <button onclick="tableBackup()">备份所选表</button>
    <label>选择该表备份<select id="tableBackupSelect"></select></label>
    <label>恢复确认文字<input id="tableRestoreConfirmation"></label>
    <button class="danger" onclick="tableRestore()">恢复所选表</button>
  </div>
</section>

<section class="card danger-zone">
  <h2>3. 单表数据清除（超级管理员）</h2>
  <p>只清除表内数据，不删除表结构。执行前自动创建该表备份。数据库维护审计表禁止清空。</p>
  <div class="toolbar">
    <label>清空目标表<input id="clearTableName" readonly></label>
    <label>清空确认文字<input id="tableClearConfirmation"></label>
    <button class="danger" onclick="tableClear()">清空所选表全部数据</button>
  </div>
</section>

<section class="card"><h2>数据表分类与维护边界</h2><label style="max-width:320px">分类筛选<select id="categoryFilter" onchange="renderTableRows()"><option value="">全部分类</option></select></label><div class="table-wrap"><table><thead><tr><th>英文表名</th><th>中文说明</th><th>分类</th><th>风险</th><th>件数</th><th>备份</th><th>恢复</th><th>清除</th><th>维护说明</th></tr></thead><tbody id="tableRows"></tbody></table></div></section>
<section class="card"><h2>备份记录</h2><div class="table-wrap"><table><thead><tr><th>时间</th><th>类型</th><th>英文表名</th><th>中文说明</th><th>Backup ID</th><th>件数／容量</th><th>操作人</th><th>状态</th></tr></thead><tbody id="backupRows"></tbody></table></div></section>
<section class="card"><h2>维护审计</h2><div class="table-wrap"><table><thead><tr><th>时间</th><th>操作</th><th>对象</th><th>操作人</th><th>理由</th><th>Backup ID</th></tr></thead><tbody id="auditRows"></tbody></table></div></section>
<section class="card"><h2>执行结果</h2><pre id="result" class="result">等待操作</pre></section>
</main>
<script>
/* BUILD037_DATABASE_MAINTENANCE_CENTER_R1 */
let state={tables:[],backups:[],audit:[]};
const $=id=>document.getElementById(id);
const esc=v=>String(v??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;");
function credentials(extra={}){return {operator:$("operator").value.trim(),role:$("role").value,reason:$("reason").value.trim(),...extra}}
async function api(url,options={}){const response=await fetch(url,{...options,headers:{"Content-Type":"application/json",...(options.headers||{})}});let data;try{data=await response.json()}catch{data={detail:await response.text()}}if(!response.ok){let detail=data.detail??data;if(typeof detail==="object")detail=detail.message??JSON.stringify(detail);throw new Error(detail||`HTTP ${response.status}`)}return data}
function show(value){$("result").textContent=typeof value==="string"?value:JSON.stringify(value,null,2)}
async function execute(action){try{if(!$("reason").value.trim())throw new Error("请先填写维护理由");show("处理中，请勿关闭页面……");const result=await action();show(result);await loadOverview()}catch(error){show("错误："+error.message);alert(error.message)}}
async function loadOverview(){try{state=await api("/api/database-maintenance/overview");render()}catch(error){show("读取失败："+error.message)}}
function render(){
 const descriptions=Object.fromEntries(state.tables.map(x=>[x.table_name,x.table_description]));
 const categories=[...new Map(state.tables.map(x=>[x.category_code,x.category_name])).entries()];const previous=$("categoryFilter").value;$("categoryFilter").innerHTML='<option value="">全部分类</option>'+categories.map(x=>`<option value="${esc(x[0])}">${esc(x[1])}</option>`).join('');if(categories.some(x=>x[0]===previous))$("categoryFilter").value=previous;renderTableRows();
 $("backupRows").innerHTML=state.backups.map(x=>`<tr><td>${esc(x.created_at)}</td><td>${esc(x.backup_type)}</td><td>${esc(x.table_name)}</td><td>${esc(x.table_description||descriptions[x.table_name]||"")}</td><td>${esc(x.backup_id)}</td><td>${esc(x.row_count??x.size_bytes)}</td><td>${esc(x.operator)}</td><td>${x.available?"可用":"文件缺失"}</td></tr>`).join("");
 $("auditRows").innerHTML=state.audit.map(x=>`<tr><td>${esc(x.created_at)}</td><td>${esc(x.action)}</td><td>${esc(x.target_name)}</td><td>${esc(x.operator)}</td><td>${esc(x.reason)}</td><td>${esc(x.backup_id)}</td></tr>`).join("");
 const current=$("tableSelect").value;$("tableSelect").innerHTML=state.tables.map(x=>`<option value="${esc(x.table_name)}">${esc(x.table_name)}｜${esc(x.table_description)} (${x.row_count})</option>`).join("");if(current&&state.tables.some(x=>x.table_name===current))$("tableSelect").value=current;
 $("fullBackupSelect").innerHTML=state.backups.filter(x=>x.backup_type==="FULL"&&x.available).map(x=>`<option value="${x.backup_id}">${esc(x.created_at)} / ${x.backup_id}</option>`).join("");syncTableControls();
}
function renderTableRows(){const filter=$("categoryFilter").value;$("tableRows").innerHTML=state.tables.filter(x=>!filter||x.category_code===filter).map(x=>`<tr><td>${esc(x.table_name)}</td><td>${esc(x.table_description)}</td><td>${esc(x.category_name)}</td><td>${esc(x.risk_level)}</td><td>${x.row_count}</td><td>${x.can_backup?'允许':'禁止'}</td><td>${x.can_restore?'允许':'禁止'}</td><td>${x.can_clear?'允许':'禁止'}</td><td>${esc(x.maintenance_note)}</td></tr>`).join('')}
function syncTableControls(){const table=$("tableSelect").value,item=state.tables.find(x=>x.table_name===table)||{};$("clearTableName").value=table;$("tableRestoreConfirmation").placeholder=`RESTORE TABLE ${table}`;$("tableClearConfirmation").placeholder=`CLEAR TABLE ${table}`;$("tableBackupSelect").innerHTML=state.backups.filter(x=>x.backup_type==="TABLE"&&x.table_name===table&&x.available).map(x=>`<option value="${x.backup_id}">${esc(x.created_at)} / ${x.row_count} 件</option>`).join("");document.querySelector('button[onclick="tableRestore()"]')?.toggleAttribute('disabled',!item.can_restore);document.querySelector('button[onclick="tableClear()"]')?.toggleAttribute('disabled',!item.can_clear)}
function fullBackup(){execute(()=>api("/api/database-maintenance/full-backup",{method:"POST",body:JSON.stringify(credentials())}))}
function fullRestore(){if(!confirm("确定恢复整个数据库吗？当前数据库将被所选备份替换。"))return;execute(()=>api("/api/database-maintenance/full-restore",{method:"POST",body:JSON.stringify(credentials({backup_id:$("fullBackupSelect").value,confirmation:$("fullConfirmation").value}))}))}
function tableBackup(){const table=$("tableSelect").value;execute(()=>api(`/api/database-maintenance/tables/${encodeURIComponent(table)}/backup`,{method:"POST",body:JSON.stringify(credentials())}))}
function tableRestore(){const table=$("tableSelect").value;if(!confirm(`确定恢复 ${table} 吗？当前表数据将被替换。`))return;execute(()=>api(`/api/database-maintenance/tables/${encodeURIComponent(table)}/restore`,{method:"POST",body:JSON.stringify(credentials({backup_id:$("tableBackupSelect").value,confirmation:$("tableRestoreConfirmation").value}))}))}
function tableClear(){const table=$("tableSelect").value;if(!confirm(`确定清空 ${table} 的全部数据吗？`))return;execute(()=>api(`/api/database-maintenance/tables/${encodeURIComponent(table)}/clear`,{method:"POST",body:JSON.stringify(credentials({confirmation:$("tableClearConfirmation").value}))}))}
loadOverview();
</script>
<script>
/* TLC_DATABASE_MAINTENANCE_LIST_INTERACTION_R1 */
(function(){
 const PAGE_SIZE=100,bodyIds=["tableRows","backupRows","auditRows"],states=new Map();let timer=0;
 function init(table){if(states.has(table))return states.get(table);const state={page:1,sort:-1,dir:"asc",busy:false};states.set(table,state);table.dataset.dbList="1";const tools=document.createElement("div");tools.className="db-list-tools";tools.innerHTML='<input class="db-all" placeholder="综合检索（全字段部分匹配）"><select class="db-field"></select><input class="db-value" placeholder="指定字段部分匹配"><button type="button" class="db-prev secondary">上一页</button><button type="button" class="db-next secondary">下一页</button><span class="db-page-info"></span>';table.parentElement.insertBefore(tools,table);const headers=[...table.querySelectorAll("thead th")],select=tools.querySelector(".db-field");headers.forEach((th,index)=>{const option=document.createElement("option");option.value=String(index);option.textContent=th.textContent.trim();select.appendChild(option);th.dataset.dbSort=String(index);th.addEventListener("click",()=>{state.dir=state.sort===index&&state.dir==="asc"?"desc":"asc";state.sort=index;state.page=1;headers.forEach(x=>x.removeAttribute("aria-sort"));th.setAttribute("aria-sort",state.dir==="asc"?"ascending":"descending");apply(table)})});tools.querySelector(".db-all").addEventListener("input",()=>{state.page=1;apply(table)});tools.querySelector(".db-value").addEventListener("input",()=>{state.page=1;apply(table)});select.addEventListener("change",()=>{state.page=1;apply(table)});tools.querySelector(".db-prev").addEventListener("click",()=>{state.page--;apply(table)});tools.querySelector(".db-next").addEventListener("click",()=>{state.page++;apply(table)});table.querySelector("tbody").addEventListener("click",event=>{if(event.target.closest("input,button,a,select"))return;const row=event.target.closest("tr");if(!row)return;table.querySelectorAll("tbody tr.db-active").forEach(x=>x.classList.remove("db-active"));row.classList.add("db-active")});return state}
 function apply(table){const state=init(table);if(state.busy)return;state.busy=true;const tools=table.previousElementSibling,all=tools.querySelector(".db-all").value.trim().toLocaleLowerCase(),field=Number(tools.querySelector(".db-field").value||0),value=tools.querySelector(".db-value").value.trim().toLocaleLowerCase();let rows=[...table.querySelectorAll("tbody tr")];rows.forEach(row=>row.dataset.dbMatch=(!all||row.textContent.toLocaleLowerCase().includes(all))&&(!value||String(row.children[field]?.textContent||"").toLocaleLowerCase().includes(value))?"1":"0");let matched=rows.filter(row=>row.dataset.dbMatch==="1");if(state.sort>=0){matched.sort((a,b)=>{const av=String(a.children[state.sort]?.textContent||"").trim(),bv=String(b.children[state.sort]?.textContent||"").trim(),an=Number(av.replace(/,/g,"")),bn=Number(bv.replace(/,/g,""));const result=Number.isFinite(an)&&Number.isFinite(bn)?an-bn:av.localeCompare(bv,undefined,{numeric:true});return state.dir==="asc"?result:-result});const current=rows.filter(row=>row.dataset.dbMatch==="1");if(matched.some((row,i)=>current[i]!==row))matched.forEach(row=>row.parentElement.appendChild(row))}const pages=Math.max(1,Math.ceil(matched.length/PAGE_SIZE));state.page=Math.max(1,Math.min(state.page,pages));const visible=new Set(matched.slice((state.page-1)*PAGE_SIZE,state.page*PAGE_SIZE));rows.forEach(row=>row.style.display=visible.has(row)?"":"none");tools.querySelector(".db-page-info").textContent=`${matched.length} 件｜第 ${state.page} / ${pages} 页`;tools.querySelector(".db-prev").disabled=state.page<=1;tools.querySelector(".db-next").disabled=state.page>=pages;state.busy=false}
 function refresh(){bodyIds.forEach(id=>{const body=document.getElementById(id);if(body){const table=body.closest("table");init(table);apply(table)}})}function schedule(){clearTimeout(timer);timer=setTimeout(refresh,30)}if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",refresh,{once:true});else refresh();new MutationObserver(schedule).observe(document.documentElement,{childList:true,subtree:true});
})();
</script></body></html>
