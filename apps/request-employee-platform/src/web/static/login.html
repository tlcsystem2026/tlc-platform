<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TLC 登录</title><style>body{margin:0;background:#eef2f7;font-family:"Microsoft YaHei",sans-serif}.box{max-width:440px;margin:7vh auto;background:white;padding:28px;border-radius:16px;box-shadow:0 15px 45px #1e293b22}label{display:block;margin:14px 0}input{width:100%;box-sizing:border-box;padding:11px;border:1px solid #cbd5e1;border-radius:8px}button{width:100%;padding:11px;background:#1d4ed8;color:white;border:0;border-radius:8px;font-weight:bold}.bootstrap{margin-top:28px;padding-top:18px;border-top:1px solid #ddd}.error{color:#b91c1c;white-space:pre-wrap}</style></head><body><main class="box"><h1>TLC 业务平台登录</h1><label>登录 ID<input id="loginId" autocomplete="username"></label><label>密码<input id="password" type="password" autocomplete="current-password"></label><label>MFA 验证码（已启用时必填）<input id="mfaCode" inputmode="numeric" maxlength="6" autocomplete="one-time-code"></label><button onclick="doLogin()">登录</button><div id="message" class="error"></div><section class="bootstrap"><h3>首次设置超级管理员</h3><p>仅系统尚未设置账号且从内部 IP 访问时可用。</p><label>员工编号<input id="employeeNo"></label><label>中文姓名<input id="nameZh"></label><label>初始密码<input id="bootstrapPassword" type="password"></label><button onclick="doBootstrap()">首次设置</button></section></main><script>async function api(u,p){const r=await fetch(u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(p)}),b=await r.json();if(!r.ok)throw Error(b.detail||'操作失败');return b}async function doLogin(){try{const b=await api('/api/auth/login',{login_id:loginId.value,password:password.value,mfa_code:mfaCode.value});location.href=b.must_change_password?'/change-password':(new URLSearchParams(location.search).get('next')||'/dashboard')}catch(e){message.textContent=e.message}}async function doBootstrap(){try{await api('/api/auth/bootstrap',{employee_no:employeeNo.value,login_id:loginId.value,name_zh:nameZh.value,password:bootstrapPassword.value});message.textContent='初始账号设置完成，请使用初始密码登录'}catch(e){message.textContent=e.message}}</script></body></html>
