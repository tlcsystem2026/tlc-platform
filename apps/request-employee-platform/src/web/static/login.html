<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TLC 业务平台登录</title>
<style>
body{margin:0;background:#eef2f7;font-family:"Microsoft YaHei",sans-serif;color:#172033}.box{max-width:550px;margin:7vh auto;background:#fff;padding:30px;border-radius:16px;box-shadow:0 15px 45px #1e293b22}h1{margin-top:0}label{display:block;margin:14px 0 6px}input{width:100%;box-sizing:border-box;padding:12px;border:1px solid #cbd5e1;border-radius:9px;font-size:16px}button{width:100%;padding:12px;background:#2554d9;color:#fff;border:0;border-radius:9px;font-weight:bold;font-size:16px;margin-top:12px;cursor:pointer}.error{color:#b91c1c;white-space:pre-wrap;margin-top:10px}.success{color:#047857;margin:10px 0}.hint{color:#64748b;font-size:14px}
</style></head><body><main class="box" data-contract="TLC_INITIAL_SUPER_ADMIN_SETUP_PAGE_SPLIT_R1">
<h1>TLC 业务平台登录</h1>
<div id="setupComplete" class="success" hidden>首次超级管理员设置完成，请使用新账号登录。</div>
<label for="loginId">登录 ID</label><input id="loginId" autocomplete="username">
<label for="password">密码</label><input id="password" type="password" autocomplete="current-password">
<label for="mfaCode">MFA 验证码（启用后必填）</label><input id="mfaCode" inputmode="numeric" maxlength="6" autocomplete="one-time-code">
<button type="button" onclick="doLogin()">登录</button>
<div id="loginMessage" class="error"></div>
</main><script>
const byId=id=>document.getElementById(id);
async function api(url,payload){const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});let b={};try{b=await r.json()}catch{}if(!r.ok)throw Error(b.detail||`操作失败（HTTP ${r.status}）`);return b}
async function doLogin(){try{const b=await api('/api/auth/login',{login_id:byId('loginId').value,password:byId('password').value,mfa_code:byId('mfaCode').value});location.href=b.must_change_password?'/change-password':(new URLSearchParams(location.search).get('next')||'/dashboard')}catch(e){byId('loginMessage').textContent=e.message}}
if(new URLSearchParams(location.search).get('setup')==='complete')byId('setupComplete').hidden=false;
</script></body></html>
