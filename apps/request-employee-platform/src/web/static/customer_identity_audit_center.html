<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>客户名称冲突核查</title><style>body{font-family:"Microsoft YaHei",sans-serif;margin:0;background:#f4f7fb;color:#172033}header{background:#173f78;color:white;padding:22px 30px}main{padding:20px}.card{background:white;border:1px solid #d8e0eb;border-radius:14px;padding:18px;margin-bottom:16px}.bar{display:flex;gap:9px;align-items:end;flex-wrap:wrap}input,select,button{padding:9px;border:1px solid #b9c4d4;border-radius:7px}button{cursor:pointer}.primary{background:#174b83;color:white}.danger{background:#a42121;color:white}table{width:100%;border-collapse:collapse;margin-top:12px}th,td{border:1px solid #d9e0e8;padding:7px}th{background:#eaf1f9}.row{cursor:pointer}.row:hover,.row.active{background:#fff1a8}.critical{color:#b42318;font-weight:bold}.warning{color:#b54708}.summary{display:flex;gap:12px;flex-wrap:wrap}.pill{padding:8px 12px;background:#edf4ff;border-radius:999px}.modal{display:none;position:fixed;inset:0;background:#0008;padding:7vh 8vw}.modal.open{display:block}.modal>div{background:white;border-radius:14px;padding:18px;max-height:80vh;overflow:auto}</style></head><body data-contract="TLC_CUSTOMER_IDENTITY_AUDIT_CONFLICT_CENTER_R1"><header><a href="/dashboard" style="color:white">← Dashboard</a><h1>客户名称冲突核查</h1><p>核查名称身份完整性、预览业务影响并以审计方式处理冲突。不会自动修改有歧义的数据。</p></header><main><section class="card"><div class="bar"><button class="primary" onclick="scan()">重新扫描</button><label>操作人<input id="backfillActor" placeholder="required"></label><button id="backfillFormalButton" class="primary" onclick="backfillFormal()">批量补齐正式名称身份</button><span id="backfillStatus"></span><label>问题类型<select id="type" onchange="render()"><option value="">全部</option><option>ORPHAN_IDENTITY</option><option>CUSTOMER_ID_MISMATCH</option><option>INACTIVE_CUSTOMER</option><option>DUPLICATE_ACTIVE_NAME</option><option>MISSING_FORMAL_IDENTITY</option></select></label><label>检索<input id="query" oninput="render()"></label></div><div id="summary" class="summary"></div></section><section class="card"><table><thead><tr><th>No</th><th>问题</th><th>客户编号</th><th>客户正式名称</th><th>登记名称</th><th>类型</th><th>状态</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table></section></main><div id="modal" class="modal"><div><h2>影响预览与处理</h2><pre id="impact"></pre><div class="bar"><label>操作人<input id="actor"></label><label>理由<input id="reason"></label><label>目标客户<input id="target"></label><button onclick="resolve('REPAIR_CUSTOMER_ID')">修复客户编号</button><button onclick="resolve('MOVE')">迁移名称</button><button class="danger" onclick="resolve('DEACTIVATE')">停用名称</button><button onclick="modal.classList.remove('open')">关闭</button></div></div></div><script>let data=[],selected='';const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function api(u,o){const r=await fetch(u,o),b=await r.json();if(!r.ok)throw Error(b.detail||JSON.stringify(b));return b}async function scan(){try{const b=await api('/api/customer-identity-audit/scan');data=b.items;summary.innerHTML=`<span class="pill">全部 ${b.total}</span><span class="pill">阻断 ${b.blocking}</span><span class="pill">允许删列：${b.ready_for_column_removal?'是':'否'}</span>`+Object.entries(b.counts).map(x=>`<span class="pill">${esc(x[0])} ${x[1]}</span>`).join('');render()}catch(e){alert(e.message)} }async function backfillFormal(){const actor=backfillActor.value.trim();if(!actor){alert('\u8bf7\u8f93\u5165\u64cd\u4f5c\u4eba');return}if(!confirm('\u786e\u8ba4\u6279\u91cf\u8865\u9f50\u7f3a\u5931\u7684\u6b63\u5f0f\u540d\u79f0\u8eab\u4efd\uff1f\u6267\u884c\u524d\u4f1a\u81ea\u52a8\u5907\u4efd\u6570\u636e\u5e93\u3002'))return;backfillFormalButton.disabled=true;backfillStatus.textContent='\u5904\u7406\u4e2d...';try{const result=await api('/api/customer-identity-audit/backfill-formal',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({actor,confirmation:'BACKFILL_FORMAL_IDENTITIES'})});backfillStatus.textContent=`\u65b0\u589e ${result.created}\uff0c\u8f6c\u6362 ${result.promoted}\uff0c\u51b2\u7a81 ${result.conflict_count}\uff0c\u5269\u4f59 ${result.remaining}`;if(result.conflict_count)alert('\u5b58\u5728\u540d\u79f0\u51b2\u7a81\uff0c\u672a\u8986\u76d6\u3002\n'+JSON.stringify(result.conflicts,null,2));await scan()}catch(e){backfillStatus.textContent='\u5931\u8d25\uff1a'+e.message;alert(e.message)}finally{backfillFormalButton.disabled=false}}function render(){const q=query.value.toLowerCase(),t=type.value;const list=data.filter(x=>(!t||x.issue_type===t)&&(!q||JSON.stringify(x).toLowerCase().includes(q)));rows.innerHTML=list.map((x,i)=>`<tr class="row" onclick="this.classList.toggle('active')"><td>${i+1}</td><td class="${x.severity==='CRITICAL'?'critical':'warning'}">${esc(x.issue_type)}</td><td>${esc(x.customer_id)}</td><td>${esc(x.formal_name)}</td><td>${esc(x.name_value)}</td><td>${esc(x.name_type)}</td><td>${x.active===0?'无效':'有效'}</td><td>${x.id?`<button onclick="event.stopPropagation();openImpact('${esc(x.id)}')">影响与处理</button>`:'请在名称维护补登记'}</td></tr>`).join('')}async function openImpact(id){selected=id;try{impact.textContent=JSON.stringify(await api(`/api/customer-identity-audit/${id}/impact`),null,2);modal.classList.add('open')}catch(e){alert(e.message)}}async function resolve(action){if(!selected||!actor.value||!reason.value){alert('操作人和理由必填');return}if(!confirm(`确认执行 ${action}？`))return;try{await api(`/api/customer-identity-audit/${selected}/resolve`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,actor:actor.value,reason:reason.value,target_customer_id:target.value})});modal.classList.remove('open');await scan()}catch(e){alert(e.message)}}scan()</script></body></html>
<!-- TLC_CUSTOMER_IDENTITY_AUDIT_SCAN_FEEDBACK_R2 -->
<script>
document.addEventListener('DOMContentLoaded',function(){
  var button=document.querySelector('button[onclick="scan()"]');
  if(!button||!window.scan)return;
  var status=document.createElement('span');status.id='scanStatus';status.setAttribute('aria-live','polite');status.textContent='准备扫描';button.insertAdjacentElement('afterend',status);
  var original=window.scan;
  window.scan=async function(){
    button.disabled=true;status.textContent='扫描中…';
    var started=Date.now();
    try{await original();status.textContent='扫描完成：'+new Date().toLocaleString()+'（'+((Date.now()-started)/1000).toFixed(1)+'秒）';}
    catch(error){status.textContent='扫描失败：'+String(error&&error.message||error);throw error;}
    finally{button.disabled=false;}
  };
});
</script>
