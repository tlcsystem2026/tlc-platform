<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>销售统计中心</title>
<style>
:root{--blue:#1f4e78;--bg:#f5f7fa;--card:#fff;--border:#d9e0e8;--muted:#667085}
*{box-sizing:border-box}body{margin:0;font-family:"Microsoft YaHei","Segoe UI",sans-serif;background:var(--bg);color:#1f2937}
header{padding:22px 30px;background:linear-gradient(90deg,#164e63,#0f766e);color:#fff}header h1{margin:0 0 6px}header p{margin:0;opacity:.9}
main{max-width:1600px;margin:auto;padding:20px}.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:16px;box-shadow:0 5px 18px rgba(15,23,42,.05)}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:end}.toolbar label{font-size:13px;color:var(--muted)}input,select,button{display:block;padding:9px 11px;border:1px solid #b8c2cc;border-radius:7px;background:#fff}button{cursor:pointer;background:var(--blue);color:#fff;font-weight:700}button.secondary{background:#64748b}a{color:var(--blue)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.kpi{border:1px solid var(--border);border-radius:12px;padding:14px;background:#fff}.kpi .name{font-size:13px;color:var(--muted)}.kpi .value{font-size:25px;font-weight:800;margin-top:6px}.kpi .unit{font-size:12px;color:var(--muted)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}table{border-collapse:collapse;width:100%;font-size:14px}th,td{padding:9px;border-bottom:1px solid #e7ebf0;text-align:left}th{background:#eef4f8;position:sticky;top:0}.scroll{max-height:480px;overflow:auto}.number{text-align:right;font-variant-numeric:tabular-nums}.message{color:var(--muted);font-size:13px;margin-top:10px}
@media(max-width:900px){.two{grid-template-columns:1fr}main{padding:12px}}
</style>
</head>
<body>
<header><h1>销售统计中心</h1><p>数据源：请求书业务审核通过后的正式销售台账（formal_sales_request_ledger）</p></header>
<main>
<section class="card">
  <div class="toolbar">
    <label>请求日期（开始）<input id="dateFrom" type="date"></label>
    <label>请求日期（结束）<input id="dateTo" type="date"></label>
    <label>Customer ID<input id="customerId" placeholder="部分一致"></label>
    <label>客户名称<input id="customerName" placeholder="部分一致"></label>
    <label>状态<select id="status"><option value="ACTIVE">ACTIVE</option><option value="VOID">VOID</option><option value="">全部</option></select></label>
    <button onclick="loadStatistics()">统计</button>
    <button class="secondary" onclick="clearFilters()">清除条件</button>
    <a href="/requests/review-workbench">返回请求书业务审核</a>
  </div>
  <div id="message" class="message"></div>
</section>

<section class="card"><div class="kpis">
  <div class="kpi"><div class="name">销售件数</div><div id="count" class="value">0</div><div class="unit">件</div></div>
  <div class="kpi"><div class="name">税前金额</div><div id="subtotal" class="value">0</div><div class="unit">JPY</div></div>
  <div class="kpi"><div class="name">消费税</div><div id="taxAmount" class="value">0</div><div class="unit">JPY</div></div>
  <div class="kpi"><div class="name">含税销售总额</div><div id="totalAmount" class="value">0</div><div class="unit">JPY</div></div>
</div></section>

<section class="card"><h2>税率区分汇总</h2><div class="kpis">
  <div class="kpi"><div class="name">10% 对象金额</div><div id="taxable10" class="value">0</div></div>
  <div class="kpi"><div class="name">10% 消费税</div><div id="tax10" class="value">0</div></div>
  <div class="kpi"><div class="name">8% 对象金额</div><div id="taxable8" class="value">0</div></div>
  <div class="kpi"><div class="name">8% 消费税</div><div id="tax8" class="value">0</div></div>
  <div class="kpi"><div class="name">非课税金额</div><div id="nonTaxable" class="value">0</div></div>
  <div class="kpi"><div class="name">免税金额</div><div id="taxExempt" class="value">0</div></div>
</div></section>

<div class="two">
<section class="card"><h2>月度销售汇总</h2><div class="scroll"><table><thead><tr><th>年月</th><th class="number">件数</th><th class="number">含税销售额</th></tr></thead><tbody id="monthRows"></tbody></table></div></section>
<section class="card"><h2>客户销售汇总</h2><div class="scroll"><table><thead><tr><th>Customer ID</th><th>客户名称</th><th class="number">件数</th><th class="number">含税销售额</th></tr></thead><tbody id="customerRows"></tbody></table></div></section>
</div>
</main>
<script>
const byId=id=>document.getElementById(id);
const esc=value=>String(value??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money=value=>Number(String(value??0).replace(/,/g,"")||0).toLocaleString("ja-JP",{maximumFractionDigits:2});
async function loadStatistics(){
  const q=new URLSearchParams();
  [["date_from","dateFrom"],["date_to","dateTo"],["customer_id","customerId"],["customer_name","customerName"],["status","status"]].forEach(([key,id])=>{const value=byId(id).value.trim();if(value)q.set(key,value)});
  byId("message").textContent="加载中...";
  try{
    const response=await fetch("/api/sales-ledger/statistics/summary?"+q.toString());
    const data=await response.json();if(!response.ok)throw new Error(data.detail||response.statusText);
    const s=data.summary;
    byId("count").textContent=Number(s.count).toLocaleString("ja-JP");byId("subtotal").textContent=money(s.subtotal);byId("taxAmount").textContent=money(s.tax_amount);byId("totalAmount").textContent=money(s.total_amount);
    byId("taxable10").textContent=money(s.taxable_amount_10);byId("tax10").textContent=money(s.tax_amount_10);byId("taxable8").textContent=money(s.taxable_amount_8);byId("tax8").textContent=money(s.tax_amount_8);byId("nonTaxable").textContent=money(s.non_taxable_amount);byId("taxExempt").textContent=money(s.tax_exempt_amount);
    byId("monthRows").innerHTML=data.by_month.map(x=>`<tr><td>${esc(x.business_month)}</td><td class="number">${Number(x.count).toLocaleString("ja-JP")}</td><td class="number">${money(x.total_amount)}</td></tr>`).join("")||'<tr><td colspan="3">没有数据</td></tr>';
    byId("customerRows").innerHTML=data.by_customer.map(x=>`<tr><td>${esc(x.customer_id)}</td><td>${esc(x.customer_name)}</td><td class="number">${Number(x.count).toLocaleString("ja-JP")}</td><td class="number">${money(x.total_amount)}</td></tr>`).join("")||'<tr><td colspan="4">没有数据</td></tr>';
    byId("message").textContent=`统计完成：${s.count} 件；状态=${data.filters.status||"全部"}`;
  }catch(error){byId("message").textContent=error.message;}
}
function clearFilters(){["dateFrom","dateTo","customerId","customerName"].forEach(id=>byId(id).value="");byId("status").value="ACTIVE";loadStatistics()}
loadStatistics();
</script>

<style data-contract="TLC_SALES_STATISTICS_LIST_INTERACTION_R1">
#salesListInteractionTools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0}#salesListInteractionTools input,#salesListInteractionTools select{padding:8px}.sales-stat-row-active>td{background:#fff1a8!important}.sales-stat-sortable{cursor:pointer;user-select:none}.sales-stat-sort-active{background:#c7ddf4!important;color:#123f69}.sales-stat-page-hidden{display:none}#salesStatPageInfo{min-width:190px;text-align:center}
</style><script data-contract="TLC_SALES_STATISTICS_LIST_INTERACTION_R1">
(function(){const SIZE=100;let page=1,key=-1,dir="asc",activeTable=null;function table(){if(activeTable&&document.contains(activeTable))return activeTable;const candidates=[...document.querySelectorAll("table")].filter(t=>t.querySelector("thead th")&&t.querySelector("tbody"));activeTable=candidates.sort((a,b)=>b.querySelectorAll("thead th").length-a.querySelectorAll("thead th").length)[0]||null;return activeTable}function data(){const t=table();return t?[...t.querySelectorAll("tbody tr")]:[]}function apply(){const t=table(),tool=document.getElementById("salesListInteractionTools");if(!t||!tool)return;let rr=data(),q=document.getElementById("salesStatSearch").value.trim().toLowerCase(),col=Number(document.getElementById("salesStatField").value);rr.forEach(r=>r.classList.remove("sales-stat-page-hidden"));rr=rr.filter(r=>!q||String(col>=0?(r.cells[col]?.innerText||""):r.innerText).toLowerCase().includes(q));if(key>=0)rr.sort((a,b)=>(a.cells[key]?.innerText||"").localeCompare(b.cells[key]?.innerText||"","zh-CN",{numeric:true,sensitivity:"base"})*(dir==="asc"?1:-1)).forEach(r=>r.parentNode.appendChild(r));const pages=Math.max(1,Math.ceil(rr.length/SIZE));page=Math.min(Math.max(1,page),pages);const visible=new Set(rr.slice((page-1)*SIZE,page*SIZE));data().forEach(r=>r.classList.toggle("sales-stat-page-hidden",!visible.has(r)));document.getElementById("salesStatPageInfo").textContent=`第 ${page} / ${pages} 页，共 ${rr.length} 件`;document.getElementById("salesStatPrev").disabled=page<=1;document.getElementById("salesStatNext").disabled=page>=pages;[...t.querySelectorAll("thead th")].forEach((h,i)=>{const active=i===key,base=h.dataset.baseTitle||h.textContent.replace(/[↑↓]$/,'').trim();h.dataset.baseTitle=base;h.classList.toggle("sales-stat-sort-active",active);h.setAttribute("aria-sort",active?(dir==="asc"?"ascending":"descending"):"none");h.textContent=base+(active?(dir==="asc"?" ↑":" ↓"):"")})}function setup(){const t=table();if(!t||t.dataset.salesStatEnhanced)return false;t.dataset.salesStatEnhanced="1";const hs=[...t.querySelectorAll("thead th")],tool=document.createElement("div");tool.id="salesListInteractionTools";tool.innerHTML=`<label>销售记录综合／字段检索 <input id="salesStatSearch" type="search" placeholder="部分匹配"></label><label>指定字段 <select id="salesStatField"><option value="-1">全部关键字段</option>${hs.map((h,i)=>`<option value="${i}">${h.textContent}</option>`).join('')}</select></label><button id="salesStatPrev" type="button">上一页</button><span id="salesStatPageInfo"></span><button id="salesStatNext" type="button">下一页</button><span>每页 100 件</span>`;t.parentNode.insertBefore(tool,t);document.getElementById("salesStatSearch").oninput=()=>{page=1;apply()};document.getElementById("salesStatField").onchange=()=>{page=1;apply()};document.getElementById("salesStatPrev").onclick=()=>{page--;apply()};document.getElementById("salesStatNext").onclick=()=>{page++;apply()};hs.forEach((h,i)=>{h.classList.add("sales-stat-sortable");h.tabIndex=0;h.onclick=()=>{if(key===i)dir=dir==="asc"?"desc":"asc";else{key=i;dir="asc"}page=1;apply()}});t.addEventListener("click",e=>{if(e.target.closest("input,button,a,select"))return;const r=e.target.closest("tbody tr");if(!r)return;data().forEach(x=>x.classList.remove("sales-stat-row-active"));r.classList.add("sales-stat-row-active")});new MutationObserver(()=>{page=1;setTimeout(apply,0)}).observe(t.tBodies[0],{childList:true});apply();return true}function start(){if(!setup()){const observer=new MutationObserver(()=>{activeTable=null;if(setup())observer.disconnect()});observer.observe(document.body,{childList:true,subtree:true})}}document.readyState==="loading"?document.addEventListener("DOMContentLoaded",start):start();})();
</script>
</body>
</html>
