<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MFA与高级安全</title><style>body{font-family:"Microsoft YaHei";background:#f5f7fb;margin:0}header{background:#152e59;color:white;padding:22px}main{max-width:1400px;margin:auto;padding:20px}.card{background:white;padding:18px;border-radius:14px;margin-bottom:16px;border:1px solid #dde4ee}input,button{padding:9px;margin:5px;border:1px solid #bbc6d4;border-radius:7px}button{background:#174a7e;color:white}table{width:100%;border-collapse:collapse}th,td{border:1px solid #dde4ee;padding:7px;text-align:left}pre{white-space:pre-wrap}/* TLC_SYSTEM_ADMIN_LIST_INTERACTION_R1 */
.tlc-unified-list-tools{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin:8px 0}.tlc-unified-list-tools input,.tlc-unified-list-tools select{width:auto!important;min-width:150px;margin:0!important}.tlc-unified-list-tools .tlc-list-page-info{margin-left:auto;color:#667085;font-size:12px}
table[data-tlc-unified-list] tbody tr{cursor:pointer}table[data-tlc-unified-list] tbody tr:hover{background:#fff4cc}table[data-tlc-unified-list] tbody tr.tlc-list-active{background:#ffe08a!important}
table[data-tlc-unified-list] th[data-tlc-list-sort]{cursor:pointer;user-select:none;white-space:nowrap}table[data-tlc-unified-list] th[data-tlc-list-sort]::after{content:' ↕';color:#8290a3;font-size:11px}table[data-tlc-unified-list] th[data-tlc-list-sort][aria-sort='ascending']::after{content:' ↑';color:#1d4ed8}table[data-tlc-unified-list] th[data-tlc-list-sort][aria-sort='descending']::after{content:' ↓';color:#1d4ed8}
</style></head><body><header><h1>MFA与高级安全</h1></header><main><section class="card"><h2>TOTP 多因素认证</h2><div id="mfaState"></div><button onclick="setup()">生成设置密钥</button><input id="code" placeholder="6位验证码" maxlength="6"><button onclick="enable()">验证并启用</button><button onclick="disable()">停用MFA</button><pre id="secret"></pre></section><section class="card"><h2>敏感操作二次验证（有效5分钟）</h2><input id="password" type="password" placeholder="当前密码"><input id="stepCode" placeholder="MFA验证码（已启用时）"><button onclick="stepup()">完成安全确认</button><span id="stepResult"></span></section><section class="card"><h2>在线会话</h2><table><thead><tr><th>用户</th><th>IP</th><th>创建</th><th>最后活动</th><th>状态</th><th></th></tr></thead><tbody id="sessions"></tbody></table></section><section class="card" id="auditCard"><h2>安全审计</h2><table><thead><tr><th>时间</th><th>事件</th><th>用户</th><th>IP</th><th>结果</th><th>详情</th></tr></thead><tbody id="audit"></tbody></table></section></main><script>const $=x=>document.getElementById(x),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function api(u,o){const r=await fetch(u,o),b=await r.json().catch(()=>({}));if(!r.ok)throw Error(b.detail||'操作失败');return b}async function load(){const d=await api('/api/security/overview');$('mfaState').textContent=d.mfa.enabled?'已启用':'未启用';$('sessions').innerHTML=d.sessions.map(x=>`<tr><td>${esc(x.login_id)}</td><td>${esc(x.client_ip)}</td><td>${esc(x.created_at)}</td><td>${esc(x.last_seen_at)}</td><td>${x.revoked_at?'已退出':'在线'}</td><td>${x.revoked_at?'':`<button onclick="revoke('${esc(x.id)}')">强制退出</button>`}</td></tr>`).join('');$('auditCard').style.display=d.is_security_admin?'block':'none';$('audit').innerHTML=d.audit.map(x=>`<tr><td>${esc(x.created_at)}</td><td>${esc(x.event_type)}</td><td>${esc(x.user_id)}</td><td>${esc(x.client_ip)}</td><td>${x.success?'成功':'失败'}</td><td>${esc(x.detail)}</td></tr>`).join('')}async function setup(){const x=await api('/api/security/mfa/setup',{method:'POST'});$('secret').textContent='密钥：'+x.secret+'\n'+x.otpauth_uri}async function enable(){await api('/api/security/mfa/enable',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code:$('code').value})});await load()}async function disable(){await api('/api/security/mfa/disable',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code:$('code').value})});await load()}async function stepup(){await api('/api/security/step-up',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:$('password').value,code:$('stepCode').value})});$('stepResult').textContent='安全确认完成，5分钟内有效'}async function revoke(id){if(confirm('确认强制退出该会话？')){await api('/api/security/sessions/'+id+'/revoke',{method:'POST'});await load()}}load().catch(e=>alert(e.message));</script><script>
/* TLC_SYSTEM_ADMIN_LIST_INTERACTION_R1 */
(function(){
 const PAGE_SIZE=100,states=new Map();let timer=0;
 function businessHeaders(table){return [...table.querySelectorAll("thead th")].filter(th=>!th.classList.contains("tlc-row-no")&&!th.classList.contains("tlc-row-check"))}
 function businessCells(row){return [...row.children].filter(td=>!td.classList.contains("tlc-row-no")&&!td.classList.contains("tlc-row-check"))}
 function init(table){
  if(states.has(table))return states.get(table);if(!table.querySelector("thead")||!table.querySelector("tbody"))return null;
  const state={page:1,sort:-1,dir:"asc",busy:false};states.set(table,state);table.dataset.tlcUnifiedList="1";
  const tools=document.createElement("div");tools.className="tlc-unified-list-tools";tools.innerHTML='<input class="tlc-list-all" placeholder="综合检索（全字段部分匹配）"><select class="tlc-list-field"></select><input class="tlc-list-value" placeholder="指定字段部分匹配"><button type="button" class="tlc-list-prev">上一页</button><button type="button" class="tlc-list-next">下一页</button><span class="tlc-list-page-info"></span>';
  table.parentElement.insertBefore(tools,table);const select=tools.querySelector(".tlc-list-field");businessHeaders(table).forEach((th,index)=>{const option=document.createElement("option");option.value=String(index);option.textContent=th.textContent.trim()||`列${index+1}`;select.appendChild(option);if(th.querySelector("input,button,select"))return;th.dataset.tlcListSort=String(index);th.addEventListener("click",()=>{state.dir=state.sort===index&&state.dir==="asc"?"desc":"asc";state.sort=index;state.page=1;businessHeaders(table).forEach(x=>x.removeAttribute("aria-sort"));th.setAttribute("aria-sort",state.dir==="asc"?"ascending":"descending");apply(table)})});
  tools.querySelector(".tlc-list-all").addEventListener("input",()=>{state.page=1;apply(table)});tools.querySelector(".tlc-list-value").addEventListener("input",()=>{state.page=1;apply(table)});select.addEventListener("change",()=>{state.page=1;apply(table)});tools.querySelector(".tlc-list-prev").addEventListener("click",()=>{state.page--;apply(table)});tools.querySelector(".tlc-list-next").addEventListener("click",()=>{state.page++;apply(table)});
  table.querySelector("tbody").addEventListener("click",event=>{if(event.target.closest("input,button,a,select,label,textarea"))return;const row=event.target.closest("tr");if(!row)return;table.querySelectorAll("tbody tr.tlc-list-active").forEach(x=>x.classList.remove("tlc-list-active"));row.classList.add("tlc-list-active")});return state;
 }
 function apply(table){
  const state=init(table);if(!state||state.busy)return;state.busy=true;const tools=table.previousElementSibling;if(!tools?.classList.contains("tlc-unified-list-tools")){state.busy=false;return}const all=tools.querySelector(".tlc-list-all").value.trim().toLocaleLowerCase(),field=Number(tools.querySelector(".tlc-list-field").value||0),value=tools.querySelector(".tlc-list-value").value.trim().toLocaleLowerCase();let rows=[...table.querySelectorAll("tbody tr")];rows.forEach(row=>row.dataset.tlcListMatch=(!all||row.textContent.toLocaleLowerCase().includes(all))&&(!value||String(businessCells(row)[field]?.textContent||"").toLocaleLowerCase().includes(value))?"1":"0");let matched=rows.filter(row=>row.dataset.tlcListMatch==="1");
  if(state.sort>=0){matched.sort((a,b)=>{const av=String(businessCells(a)[state.sort]?.textContent||"").trim(),bv=String(businessCells(b)[state.sort]?.textContent||"").trim(),an=Number(av.replace(/,/g,"")),bn=Number(bv.replace(/,/g,""));const result=Number.isFinite(an)&&Number.isFinite(bn)?an-bn:av.localeCompare(bv,undefined,{numeric:true});return state.dir==="asc"?result:-result});const current=rows.filter(row=>row.dataset.tlcListMatch==="1");if(matched.some((row,i)=>current[i]!==row))matched.forEach(row=>row.parentElement.appendChild(row))}
  const pages=Math.max(1,Math.ceil(matched.length/PAGE_SIZE));state.page=Math.max(1,Math.min(state.page,pages));const visible=new Set(matched.slice((state.page-1)*PAGE_SIZE,state.page*PAGE_SIZE));rows.forEach(row=>row.style.display=visible.has(row)?"":"none");tools.querySelector(".tlc-list-page-info").textContent=`${matched.length} 件｜第 ${state.page} / ${pages} 页`;tools.querySelector(".tlc-list-prev").disabled=state.page<=1;tools.querySelector(".tlc-list-next").disabled=state.page>=pages;state.busy=false;
 }
 function refresh(){document.querySelectorAll("table").forEach(table=>{init(table);apply(table)})}function schedule(){clearTimeout(timer);timer=setTimeout(refresh,35)}if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",refresh,{once:true});else refresh();new MutationObserver(schedule).observe(document.documentElement,{childList:true,subtree:true});
})();
</script></body></html>
