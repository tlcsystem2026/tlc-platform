<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MFA与高级安全</title><style>body{font-family:"Microsoft YaHei";background:#f5f7fb;margin:0}header{background:#152e59;color:white;padding:22px}main{max-width:1400px;margin:auto;padding:20px}.card{background:white;padding:18px;border-radius:14px;margin-bottom:16px;border:1px solid #dde4ee}input,button{padding:9px;margin:5px;border:1px solid #bbc6d4;border-radius:7px}button{background:#174a7e;color:white}table{width:100%;border-collapse:collapse}th,td{border:1px solid #dde4ee;padding:7px;text-align:left}pre{white-space:pre-wrap}</style></head><body><header><h1>MFA与高级安全</h1></header><main><section class="card"><h2>TOTP 多因素认证</h2><div id="mfaState"></div><button onclick="setup()">生成设置密钥</button><input id="code" placeholder="6位验证码" maxlength="6"><button onclick="enable()">验证并启用</button><button onclick="disable()">停用MFA</button><pre id="secret"></pre></section><section class="card"><h2>敏感操作二次验证（有效5分钟）</h2><input id="password" type="password" placeholder="当前密码"><input id="stepCode" placeholder="MFA验证码（已启用时）"><button onclick="stepup()">完成安全确认</button><span id="stepResult"></span></section><section class="card"><h2>在线会话</h2><table><thead><tr><th>用户</th><th>IP</th><th>创建</th><th>最后活动</th><th>状态</th><th></th></tr></thead><tbody id="sessions"></tbody></table></section><section class="card" id="auditCard"><h2>安全审计</h2><table><thead><tr><th>时间</th><th>事件</th><th>用户</th><th>IP</th><th>结果</th><th>详情</th></tr></thead><tbody id="audit"></tbody></table></section></main><script>const $=x=>document.getElementById(x),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function api(u,o){const r=await fetch(u,o),b=await r.json().catch(()=>({}));if(!r.ok)throw Error(b.detail||'操作失败');return b}async function load(){const d=await api('/api/security/overview');$('mfaState').textContent=d.mfa.enabled?'已启用':'未启用';$('sessions').innerHTML=d.sessions.map(x=>`<tr><td>${esc(x.login_id)}</td><td>${esc(x.client_ip)}</td><td>${esc(x.created_at)}</td><td>${esc(x.last_seen_at)}</td><td>${x.revoked_at?'已退出':'在线'}</td><td>${x.revoked_at?'':`<button onclick="revoke('${esc(x.id)}')">强制退出</button>`}</td></tr>`).join('');$('auditCard').style.display=d.is_security_admin?'block':'none';$('audit').innerHTML=d.audit.map(x=>`<tr><td>${esc(x.created_at)}</td><td>${esc(x.event_type)}</td><td>${esc(x.user_id)}</td><td>${esc(x.client_ip)}</td><td>${x.success?'成功':'失败'}</td><td>${esc(x.detail)}</td></tr>`).join('')}async function setup(){const x=await api('/api/security/mfa/setup',{method:'POST'});$('secret').textContent='密钥：'+x.secret+'\n'+x.otpauth_uri}async function enable(){await api('/api/security/mfa/enable',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code:$('code').value})});await load()}async function disable(){await api('/api/security/mfa/disable',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code:$('code').value})});await load()}async function stepup(){await api('/api/security/step-up',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:$('password').value,code:$('stepCode').value})});$('stepResult').textContent='安全确认完成，5分钟内有效'}async function revoke(id){if(confirm('确认强制退出该会话？')){await api('/api/security/sessions/'+id+'/revoke',{method:'POST'});await load()}}load().catch(e=>alert(e.message));</script></body></html>
