<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>修改密码</title><style>body{background:#eef2f7;font-family:"Microsoft YaHei"}.box{max-width:440px;margin:10vh auto;background:#fff;padding:28px;border-radius:16px}label{display:block;margin:14px 0}input{width:100%;box-sizing:border-box;padding:10px}button{padding:11px 18px;background:#1d4ed8;color:#fff;border:0;border-radius:8px}.msg{white-space:pre-wrap}</style></head><body><main class="box"><h1>修改密码</h1><p>新密码至少12位，并包含大写字母、小写字母和数字。</p><label>当前密码<input id="current" type="password"></label><label>新密码<input id="next" type="password"></label><label>再次输入<input id="confirmPassword" type="password"></label><button onclick="changePassword()">保存新密码</button><div id="message" class="msg"></div></main><script>async function changePassword(){if(next.value!==confirmPassword.value){message.textContent='两次输入的新密码不一致';return}const r=await fetch('/api/auth/change-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({current_password:current.value,new_password:next.value})}),b=await r.json();if(!r.ok){message.textContent=b.detail||'修改失败';return}message.textContent='密码修改完成，其他旧会话已撤销';setTimeout(()=>location.href='/dashboard',1000)}</script></body></html>
